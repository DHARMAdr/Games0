<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRAP LAB — Traps & Hazards Studio</title>
<style>
/* ===== TRAP LAB — one self-contained file (HTML + CSS + JS). Dark developer aesthetic, CSS Grid/Flexbox, no libraries.
   Sections: 1 Traps dashboard · 2 Physics playground (AI bot) · 3 Unlock shop · 4 Wave generator · 5 Designer studio. ===== */
:root{--bg:#070b14;--pn:#0d1424;--ln:#1c2b4a;--tx:#dbe8ff;--mu:#7e93b8;--cy:#00e5ff;--mg:#ff2bd6;--gr:#39ff88;--rd:#ff3b3b;--yl:#ffd23f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-monospace,Consolas,'Courier New',monospace}
body{min-height:100vh;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#0a1020ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;letter-spacing:.14em;color:var(--cy);text-shadow:0 0 12px var(--cy)}.logo b{color:var(--mg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab-btn,.btn{font:inherit;color:var(--tx);background:#0f1a30;border:1px solid var(--ln);padding:7px 12px;border-radius:6px;cursor:pointer;transition:.15s}
.tab-btn:hover,.btn:hover{border-color:var(--cy);box-shadow:0 0 10px #00e5ff44}.tab-btn.on,.btn.on{background:var(--cy);color:#000;border-color:var(--cy);font-weight:700}
.sp{flex:1}.chip{padding:5px 10px;border:1px solid var(--ln);border-radius:20px;font-size:.8rem;color:var(--yl);background:#0f1a30}
.home{color:var(--gr);border:1px solid var(--gr);padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:700;letter-spacing:.1em}.home:hover{background:var(--gr);color:#000}
main{max-width:1200px;margin:auto;padding:14px}section.tab{display:none}section.tab.on{display:block;animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h2{margin:6px 0 10px;font-size:1.05rem;color:var(--cy);letter-spacing:.1em}.mu{color:var(--mu);font-size:.8rem}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px}
/* ---------- 1. traps dashboard ---------- */
.stage{display:grid;grid-template-columns:minmax(260px,1.2fr) 1fr;gap:14px;margin-bottom:14px}.stage .view{display:flex;align-items:center;justify-content:center;min-height:240px;background:#050912;border-radius:8px;overflow:hidden;border:1px solid var(--ln)}
.stage .view .pv{width:200px;zoom:2.2}.stage .info h3{margin:0 0 6px;color:var(--yl)}.bars div{margin:6px 0;font-size:.78rem}.meter{height:8px;background:#16213a;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--yl),var(--rd));transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--cy)}.card.active{border-color:var(--gr);box-shadow:0 0 18px #39ff8855}.card h3{margin:8px 0 3px;font-size:.92rem}.card p{margin:0;color:var(--mu);font-size:.76rem;line-height:1.35}
.badge{z-index:3;position:absolute;top:8px;right:8px;background:var(--gr);color:#000;font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:10px;display:none}.card.active .badge{display:block}
/* CSS-animated mini previews (also used enlarged in the stage) */
.pv{position:relative;height:96px;overflow:hidden;border-radius:8px;background:linear-gradient(#0a1224,#060a14);border:1px solid var(--ln)}.pv i,.pv b{position:absolute;display:block}
.pv .floor{left:0;right:0;bottom:0;height:8px;background:#22314f}.pv .ball{width:14px;height:14px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 10px #f33;left:22%;animation:pvb 1.1s cubic-bezier(.3,0,.7,1) infinite}
@keyframes pvb{0%,100%{bottom:8px}50%{bottom:58px}}
.pv .spk{bottom:8px;left:105%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid #e8f1ff;animation:pvs 2.2s linear infinite}@keyframes pvs{to{transform:translateX(-260px)}}
.pv .beam{left:0;right:0;height:3px;background:var(--mg);box-shadow:0 0 12px var(--mg);animation:pvl 1.8s ease-in-out infinite alternate}@keyframes pvl{from{top:14px}to{top:74px}}
.pv .th{bottom:8px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:20px solid #b6ff6a;transform-origin:bottom;animation:pvt 1.5s steps(5) infinite}@keyframes pvt{0%,30%{transform:scaleY(0)}60%,80%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.pv .zone{left:38%;width:34%;top:0;bottom:8px;background:linear-gradient(#7c4dff66,#00e5ff1a);border-left:1px dashed #7c4dff;border-right:1px dashed #7c4dff}.pv .ar{color:#9fd;font-size:14px;animation:pva 1.2s linear infinite}@keyframes pva{from{transform:translateY(40px);opacity:0}50%{opacity:1}to{transform:translateY(-30px);opacity:0}}
.pv .ball.fl{left:50%;animation:pvf 2s ease-in-out infinite alternate}@keyframes pvf{from{bottom:10px}to{bottom:70px}}
.pv.sub{background:linear-gradient(#1b0b33,#080512 55%,#12121c)}.pv .trk{top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,#fff1 0 1px,transparent 1px) 0 0/25% 100%,#2a2a3c;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.pv .tr{left:calc(50% - 16px);top:24px;width:32px;height:28px;background:#e74c3c;box-shadow:0 0 12px #e74c3c;transform-origin:bottom;animation:pvn 2s ease-in infinite}@keyframes pvn{from{top:22px;transform:scale(.25)}to{top:58px;transform:scale(1.9);opacity:.9}}
.pv .lo{left:calc(50% - 20px);top:30px;height:10px;width:40px;background:repeating-linear-gradient(45deg,#fff 0 6px,#e53935 6px 12px);animation:pvn 2s ease-in infinite;transform-origin:bottom}
.pv .sw{top:42px;width:26px;height:26px;background:#ffd600;box-shadow:0 0 10px #ffd600;animation:pvw 1.8s ease-in-out infinite alternate}@keyframes pvw{from{left:14%}to{left:70%}}
.pv .po{left:calc(50% - 26px);top:44px;width:52px;height:14px;border-radius:50%;background:#000;border:2px solid #ffca28;animation:pvn 2s ease-in infinite;transform-origin:bottom}.pv .ru{left:calc(50% - 6px);bottom:10px;width:12px;height:22px;background:#3498db;border-radius:3px;animation:pvj 1.2s ease-out infinite}@keyframes pvj{0%,100%{bottom:10px}50%{bottom:44px}}
/* ---------- 2/5/6 canvas areas ---------- */
.split{align-items:start;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:12px}.cvwrap{position:relative;border:2px solid var(--ln);border-radius:10px;overflow:hidden;background:#000}.cvwrap canvas{width:100%;display:block}
.cvwrap.hit{animation:hitf .45s}@keyframes hitf{0%,100%{box-shadow:0 0 0 0 #f000}30%{box-shadow:inset 0 0 70px 20px #ff1744}}
.cvwrap.dead{border-color:var(--rd);animation:deadf .6s infinite alternate}@keyframes deadf{from{box-shadow:0 0 0 #f000}to{box-shadow:0 0 30px 6px #ff1744,inset 0 0 60px #ff174455}}
.ovl{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#200008cc;color:#fff;text-align:center;font-weight:800;font-size:1.6rem;letter-spacing:.1em;text-shadow:0 0 18px #ff1744}.cvwrap.dead .ovl{display:flex}.ovl small{font-size:.75rem;font-weight:400;color:#ffc9d0;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.row label{font-size:.78rem;color:var(--mu)}.btn.sm{padding:4px 8px;font-size:.75rem}input[type=range]{accent-color:var(--cy)}
.kv{width:100%;border-collapse:collapse;font-size:.78rem}.kv td{padding:3px 4px;border-bottom:1px solid #16213a}.kv td:last-child{text-align:right;color:var(--gr)}
.danger{height:14px;background:#16213a;border-radius:7px;overflow:hidden;border:1px solid var(--ln)}.danger i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39ff88,#ffd23f 55%,#ff1744);transition:width .6s ease}
.react{height:12px;background:#16213a;border-radius:6px;overflow:hidden}.react i{display:block;height:100%;width:100%;background:var(--cy);transition:width .08s linear,background .2s}
/* ---------- 3. shop ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.shop{border-radius:12px;padding:14px}.shop h2{margin-top:0}
.shop.nokia{background:#9bbc0f;color:#0f380f;border:4px solid #0f380f;box-shadow:6px 6px 0 #0f380f;font-family:'Courier New',monospace;image-rendering:pixelated}.shop.nokia h2{color:#0f380f;text-shadow:none}
.shop.cyber{background:linear-gradient(160deg,#1a0536,#08031a 60%,#14002e);border:2px solid var(--mg);box-shadow:0 0 28px #ff2bd655,inset 0 0 30px #00e5ff22}.shop.cyber h2{color:var(--cy);text-shadow:0 0 14px var(--cy)}
.item{position:relative;margin:10px 0;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;transition:.2s}
.nokia .item{background:#8bac0f;border:3px solid #0f380f}.nokia .item.owned{background:#306230;color:#9bbc0f}.cyber .item{border:1px solid var(--cy);border-radius:8px;background:#0a0420cc;box-shadow:0 0 14px #00e5ff33}.cyber .item.owned{border-color:var(--gr);box-shadow:0 0 16px #39ff8866}
.item h3{margin:0 0 4px;font-size:.9rem}.item p{margin:0 0 6px;font-size:.72rem;opacity:.85}.item .btn{background:transparent}.nokia .item .btn{color:#0f380f;border:2px solid #0f380f;border-radius:0}.nokia .item.owned .btn{color:#9bbc0f;border-color:#9bbc0f}
.cyber .item .btn{color:var(--cy);border-color:var(--cy);text-shadow:0 0 8px var(--cy)}.cyber .item .btn:hover{background:var(--cy);color:#000}
.shake{animation:shk .45s}@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.nope{animation:shk .45s;outline:2px solid var(--rd)}
.sk{position:relative;height:70px;overflow:hidden;background:#0003;border-radius:4px}.sk i{position:absolute;display:block}
.nokia .sk{background:#8bac0f;border:2px solid #0f380f}.sk .ps{bottom:4px;width:16px;height:16px;background:#0f380f;clip-path:polygon(0 100%,25% 60%,25% 40%,50% 40%,50% 0,75% 0,75% 60%,100% 100%)}
.sk .acid{left:6px;right:6px;bottom:4px;height:14px;background:#0f380f;overflow:hidden}.sk .acid::after{content:"";position:absolute;top:3px;right:3px;bottom:3px;left:3px;background:radial-gradient(circle,#9bbc0f 2px,transparent 3px) 0 0/10px 10px;animation:bub 1s linear infinite}@keyframes bub{to{background-position:0 -10px}}
.sk .ring{left:34px;top:12px;width:34px;height:34px;border:4px dashed #0f380f;border-radius:50%;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sk .holo{left:14px;top:10px;width:68px;height:44px;background:repeating-linear-gradient(0deg,#00e5ff55 0 2px,#00e5ff11 2px 6px);border:1px solid var(--cy);box-shadow:0 0 14px var(--cy);animation:flick 1.4s steps(2) infinite}@keyframes flick{50%{opacity:.55}}
.sk .fence{top:6px;width:3px;height:54px;background:var(--mg);box-shadow:0 0 10px var(--mg);animation:flick .9s steps(2) infinite}.sk .drone{left:30px;top:14px;width:34px;height:14px;background:var(--cy);border-radius:7px;box-shadow:0 0 14px var(--cy);animation:hov 1.6s ease-in-out infinite alternate}.sk .drone::before{content:"";position:absolute;left:-6px;right:-6px;top:-4px;height:3px;background:#fff;animation:flick .2s steps(2) infinite}@keyframes hov{to{transform:translateY(26px)}}
/* ---------- 4. generator ---------- */
.log{height:230px;overflow-y:auto;background:#04070f;border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:.74rem;line-height:1.5}.log div{border-bottom:1px solid #0e172b}.log .e{color:var(--gr)}.log .m{color:var(--yl)}.log .h{color:#ff7a59}.log .n{color:var(--mg)}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}.params div{background:#0b1326;border:1px solid var(--ln);border-radius:8px;padding:8px;text-align:center}.params b{display:block;font-size:1.1rem;color:var(--cy)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.trow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.76rem;color:var(--mu)}.trow label{display:flex;align-items:center;gap:5px}
@media(max-width:820px){.stage,.split{grid-template-columns:1fr}.stage .view .pv{zoom:1.5}}

 <div class="logo">TRAP<b>//</b>LAB</div>
 <nav class="tabs" id="tabs"></nav><div class="sp"></div>

<main>
 <section class="tab on" id="t-traps"></section><section class="tab" id="t-play"></section><section class="tab" id="t-shop"></section><section class="tab" id="t-gen"></section><section class="tab" id="t-studio"></section>

<script src="compat.js"></script><script>
'use strict';
/* =============================================================================
   TRAP LAB — module map (all plain JS, no libraries)
   1. STATE & UTILS      saved in localStorage ('traplab.v1'), so equipped traps, coins, unlocks and difficulty persist
   2. DATA & DIFFICULTY  trap definitions + diffParams(level) -> speed / spawn rate / safe gap / damage / reaction window
   3. SIM ENGINE         class Sim: ONE engine for Bounce physics and pseudo-3D Subway, used by the Playground and the Studio
   4. TABS               Traps dashboard · Playground · Shop · Generator · Studio
   5. MAIN LOOP          one requestAnimationFrame loop that only updates the visible tab
   IMPROVE: add more trap types in TRAPS + Sim.add(); tune diffParams(); connect to the real games by exporting the same numbers.
   ============================================================================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],rnd=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---------- 1. STATE ----------
let S={mode:'bounce',tab:'traps',equipped:{bounce:'spike',subway:'train'},coins:1500,unlocked:{},deployed:{},level:5};
try{const r=JSON.parse(localStorage.getItem('traplab.v1')||'{}');if(r&&typeof r=='object')for(const k in S)if(typeof r[k]==typeof S[k])S[k]=r[k]}catch(e){}
const save=()=>{try{localStorage.setItem('traplab.v1',JSON.stringify(S))}catch(e){}};
// ---------- 2. DATA ----------
const TRAPS={bounce:[
 {id:'spike',name:'Classic Floor Spikes',cls:'',dg:30,desc:'Static triangle spikes on the floor. Any touch is instant defeat - bounce over them.',pv:'<i class="floor"></i><i class="spk"></i><i class="spk" style="animation-delay:-1.1s"></i><i class="ball"></i>'},
 {id:'laser',name:'Moving Laser Beams',cls:'',dg:55,desc:'Energy beams sweep up and down the screen. Time your bounce to slip through the gap.',pv:'<i class="floor"></i><i class="beam"></i><i class="beam" style="animation-delay:-.9s"></i><i class="ball"></i>'},
 {id:'thorn',name:'Popping Thorns',cls:'',dg:45,desc:'Thorns pop out of the floor on a rhythm. Learn the beat, then bounce between pops.',pv:'<i class="floor"></i><i class="th" style="left:30%"></i><i class="th" style="left:50%;animation-delay:-.5s"></i><i class="th" style="left:70%;animation-delay:-1s"></i><i class="ball" style="left:12%"></i>'},
 {id:'grav',name:'Anti-Gravity Zones',cls:'',dg:40,desc:'Inside the zone gravity flips and the ball floats upward - fall out before the ceiling hazards.',pv:'<i class="floor"></i><i class="zone"></i><i class="ar" style="left:46%;bottom:10px">↑</i><i class="ar" style="left:58%;bottom:10px;animation-delay:-.6s">↑</i><i class="ball fl"></i>'}],
 subway:[
 {id:'train',name:'Stationary Train Cars',cls:'sub',dg:70,desc:'Solid train cars block a lane. Change lanes early - you cannot jump or roll through them.',pv:'<i class="trk"></i><i class="tr"></i>'},
 {id:'low',name:'Low Clearance Barricades',cls:'sub',dg:50,desc:'Low striped barricades. Jump over them (or roll if you are quick on the keys).',pv:'<i class="trk"></i><i class="lo"></i><i class="ru"></i>'},
 {id:'sweep',name:'Moving Side-Sweeper Cleaners',cls:'sub',dg:65,desc:'A cleaner machine slides across the lanes. Read its rhythm and jump or switch lane.',pv:'<i class="trk"></i><i class="sw"></i>'},
 {id:'pot',name:'Pothole Grates',cls:'sub',dg:35,desc:'Open grates in the track. Jump over the hole or you stumble.',pv:'<i class="trk"></i><i class="po"></i><i class="ru"></i>'}]};
const SHOP=[
 {id:'pspike',mode:'bounce',name:'Pixel Spikes',cost:200,desc:'Chunky 8-bit spikes, same lethal rules.',pv:'<i class="ps" style="left:14px"></i><i class="ps" style="left:34px"></i><i class="ps" style="left:54px"></i>'},
 {id:'acid',mode:'bounce',name:'Acid Pools',cost:500,desc:'Bubbling floor pools: deadly to touch, jump them.',pv:'<i class="acid"></i>'},
 {id:'ring',mode:'bounce',name:'Moving Electric Ring Blocks',cost:800,desc:'Spinning electric rings drifting up and down.',pv:'<i class="ring"></i>'},
 {id:'holo',mode:'subway',name:'Holographic Barriers',cost:400,desc:'Flickering hologram wall: jump through the timing.',pv:'<i class="holo"></i>'},
 {id:'fence',mode:'subway',name:'Laser Fences',cost:600,desc:'Neon laser fence at head height: roll under it.',pv:'<i class="fence" style="left:20px"></i><i class="fence" style="left:42px;animation-delay:-.3s"></i><i class="fence" style="left:64px;animation-delay:-.6s"></i>'},
 {id:'drone',mode:'subway',name:'Hover-Drones',cost:900,desc:'Drones sweep across lanes at low altitude.',pv:'<i class="drone"></i>'}];
const TYPES={bounce:{spike:'Floor spikes',crush:'Crushing bars',missile:'Homing missiles',mud:'Sticky mud (-60%)',spring:'Trampoline → ceiling spikes',firebar:'Rotating fire-bar',grav:'Anti-gravity zone',pspike:'Pixel spikes ★',acid:'Acid pool ★',ring:'Electric ring ★'},
 subway:{hh:'High hurdle (roll)',lh:'Low hurdle (jump)',train:'Oncoming train',sweep:'Side-sweeper',pot:'Pothole grate',double:'Double-lane barricade',holo:'Holo barrier ★',fence:'Laser fence ★',drone:'Hover-drone ★'}};
const STAR={pspike:'pspike',acid:'acid',ring:'ring',holo:'holo',fence:'fence',drone:'drone'};   // ★ = shop skins; only spawnable once unlocked + deployed
const tier=l=>l<=3?0:l<=6?1:l<=9?2:3,TIERN=['EASY','MEDIUM','HARD','NIGHTMARE'];
// diffParams(level 1..10+): the numbers every simulator reads. speed px/s, spawn ms between waves, gap = safe px between traps, dmg per hit (HP mode), react = ms to react.
function diffParams(l){const speed=190+l*34,spawn=Math.max(650,2900-l*215),gap=Math.max(150,540-l*36),dmg=15+l*3;return{speed,spawn,gap,dmg,react:Math.round(gap/speed*1000)}}
// ---------- 3. SIM ENGINE ----------
class Sim{
 constructor(cv,wrap,o){this.cv=cv;this.c=cv.getContext('2d');this.W=cv.width;this.H=cv.height;this.wrap=wrap;this.o=Object.assign({bot:true,ko:true,chain:false,types:{},ev(){}},o);this.mult=1;this.reset()}
 get mode(){return S.mode}
 reset(){this.t=0;this.obs=[];this.score=0;this.dodged=0;this.over=false;this.hp=100;this.inv=0;this.spT=1;this.fx=[];this.mud=false;this.grav=false;this.b={y:300,vy:-300,cd:0};this.p={x:1,lane:1,jump:0,roll:0};this.err=0;this.wrap&&this.wrap.classList.remove('dead','hit')}
 P(){const d=diffParams(S.level),m=this.mult;return{speed:d.speed*(1+.12*(m-1)),spawn:d.spawn/(1+.2*(m-1)),gap:d.gap/(1+.15*(m-1)),dmg:d.dmg*(1+.2*(m-1)),react:0}}
 enabled(){return Object.keys(this.o.types).filter(k=>this.o.types[k]&&(TYPES[this.mode][k]!==undefined)&&(!STAR[k]||(S.unlocked[k]&&S.deployed[k])))}
 // ----- spawning (random or chained combos). Safe-gap rule: a new wave is only added once the previous one is far enough away.
 farthest(){let m=-1e9;for(const o of this.obs)m=Math.max(m,this.mode=='bounce'?o.x:o.d);return m}
 spawn(){const P=this.P(),on=this.enabled();if(!on.length)return;const far=this.farthest(),start=this.mode=='bounce'?this.W+40:1000;if(this.obs.length&&start-far<P.gap)return;
  if(this.o.chain)return this.chain(P);this.add(rnd(on),start)}
 chain(P){const pair=Math.max(170,P.gap*.55);if(this.mode=='subway'){const L=rnd([0,1,2]);this.add('lh',1000,L);this.add('hh',1000+pair,L)}   // jump over a hurdle, immediately roll under a barricade
  else{const g=Math.max(112,160-S.level*4);this.obs.push({t:'crush',x:this.W+40,w:46,ph:0,gap:g},{t:'crush',x:this.W+40+pair,w:46,ph:2.4,gap:g})}}   // two closing walls to squeeze between
 add(t,x,lane){const o=this.obs;if(this.mode=='bounce'){switch(t){
   case'spike':case'pspike':o.push({t,x,w:36});break;case'acid':o.push({t,x,w:90});break;case'crush':o.push({t,x,w:46,ph:Math.random()*6,gap:Math.max(125,175-S.level*5)});break;
   case'missile':o.push({t,x,y:70+Math.random()*190,w:22});break;case'mud':o.push({t,x,w:150});break;case'spring':o.push({t,x,w:34},{t:'ceil',x:x+120,w:90});break;
   case'firebar':o.push({t,x,y:170,len:84,a:Math.random()*6});break;case'grav':o.push({t,x,w:150});break;case'ring':o.push({t,x,y:180,ph:Math.random()*6,r:22});break}return}

// ----- Tab 2: playground
const play={sim:null,build(){const el=$('#t-play');el.innerHTML=`<h2>PHYSICS PLAYGROUND — AI bot vs traps (${S.mode.toUpperCase()})</h2><div class="split"><div class="cvwrap" id="pw"><canvas id="pc" width="800" height="340"></canvas><div class="ovl">💥 EXPLOSION · GAME OVER<small>press R or ↻ RESTART</small></div></div><div id="pside"></div></div>
  <p class="mu">Manual play: turn the AI bot OFF. Bounce: Space/↑ boost, ↓ fast-fall. Subway: ←/→ lanes, ↑ jump, ↓ roll. Collisions: spikes/acid/bars/missiles/trains = defeat · mud slows 60% · springs launch you into ceiling spikes.</p>`;
  const old=this.sim;this.sim=new Sim($('#pc'),$('#pw'),{bot:old?old.o.bot:true,ko:old?old.o.ko:true,types:old?old.o.types:{},auto:true});this.side()},
  side(){controls(this.sim,$('#pside'),{id:'pl',after:()=>{}})},tick(){const s=this.sim;if(!s)return;const d=$('#pl-dg');if(d){d.style.width=s.danger()+'%';$('#pl-st').textContent=`speed ${s.P().speed|0}px/s · gap ${s.P().gap|0}px · hp ${s.o.ko?'KO':Math.max(0,s.hp|0)} · ×${s.mult.toFixed(1)}`}}};
// ----- Tab 3: shop (Nokia-green + cyberpunk skins, mock currency)
function renderShop(){const item=i=>{const own=S.unlocked[i.id];return`<div class="item${own?' owned':''}" data-it="${i.id}"><div class="sk">${i.pv}</div><div><h3>${i.name}</h3><p>${i.desc}</p><button class="btn sm" data-buy="${i.id}">${own?(S.deployed[i.id]?'✔ DEPLOYED (click to stow)':'UNLOCKED & READY TO DEPLOY'):'🔓 UNLOCK · '+i.cost+' COINS'}</button></div></div>`};
 $('#t-shop').innerHTML=`<h2>TRAP SKIN SHOP — spend your mock coins (${S.coins})</h2><div class="row"><button class="btn sm" data-add="500">+500 demo coins</button><button class="btn sm" data-add="-1">reset shop</button></div>
 <div class="shopgrid"><div class="shop nokia"><h2>▓ RETRO BOUNCE TRAPS</h2>${SHOP.filter(i=>i.mode=='bounce').map(item).join('')}</div><div class="shop cyber"><h2>◢ CYBER SUBWAY TRAPS</h2>${SHOP.filter(i=>i.mode=='subway').map(item).join('')}</div></div><p class="mu">Unlocked traps are permanent (saved). Deployed ★ traps appear in the Playground/Studio spawn lists.</p>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-buy]'),a=e.target.closest('[data-add]');if(a){S.coins=a.dataset.add=='-1'?1500:S.coins+500;if(a.dataset.add=='-1'){S.unlocked={};S.deployed={}}save();head();renderShop();return}
 if(!b)return;const it=SHOP.find(i=>i.id==b.dataset.buy),card=b.closest('.item');if(S.unlocked[it.id]){S.deployed[it.id]=!S.deployed[it.id];save();renderShop();return}
 if(S.coins>=it.cost){S.coins-=it.cost;S.unlocked[it.id]=1;S.deployed[it.id]=1;save();head();card.classList.add('shake');setTimeout(renderShop,480)}else{card.classList.add('nope');b.textContent='NOT ENOUGH COINS';setTimeout(()=>card.classList.remove('nope'),500)}});
// ----- Tab 4: procedural wave generator (log + canvas stream)
const gen={t:0,tokens:[],n:0,lines:[],build(){$('#t-gen').innerHTML=`<h2>PROCEDURAL TRAP GENERATOR — ${S.mode.toUpperCase()} LOGIC</h2><div class="split"><div><div class="panel"><div class="row">${['EASY:2','MEDIUM:5','HARD:8','NIGHTMARE:10'].map(s=>{const[n,l]=s.split(':');return`<button class="btn sm ${tier(S.level)==tier(+l)?'on':''}" data-g="${l}">${n}</button>`}).join('')}<label>Level ${S.level}</label><input type="range" min="1" max="10" value="${S.level}" data-gs style="flex:1"></div><div class="params" id="gp"></div><div class="mu" id="gt"></div></div>
  <canvas id="gc" width="640" height="150" style="width:100%;border:1px solid var(--ln);border-radius:8px;margin-top:10px;background:#04070f"></canvas></div><div><div class="panel"><h2>LIVE WAVE LOG</h2><div class="log" id="glog"></div></div></div></div>`;this.params()},
 params(){const d=diffParams(S.level),t=tier(S.level),rules={bounce:['Static, widely-spaced ground spikes with a slow pulse','+ vertically moving ceiling hazards and rotating fire-bars (rhythm timing)','+ dynamic homing missiles that track the ball','ALL hazards, maximum speed, tiny gaps'],subway:['Predictable single-lane barriers and wide potholes','+ moving side-sweepers and double-lane barricades (swift lane changes)','+ high-speed oncoming trains that switch lanes right before impact','ALL hazards, frame-perfect dodges']}[S.mode][t];
  $('#gp').innerHTML=`<div>speed<b>${d.speed|0}</b>px/s</div><div>spawn every<b>${d.spawn|0}</b>ms</div><div>safe gap<b>${d.gap|0}</b>px</div><div>damage<b>${d.dmg|0}</b>/hit</div><div>reaction<b>${d.react}</b>ms</div>`;$('#gt').innerHTML=`<b style="color:var(--yl)">${TIERN[t]}</b>: ${rules}`},
 wave(){const l=S.level,t=tier(l),d=diffParams(l),sub=S.mode=='subway',g=d.gap|0;let k,c,cls;
  if(!sub){if(t==0){k=`STATIC SPIKES ×${2+(Math.random()*2|0)} · spacing ${g}px · slow pulse`;c='e'}else if(t==1){k=rnd([`CEILING CRUSHER (vertical sweep ${(1.5+l*.1).toFixed(1)}s) + spike`,`ROTATING FIRE-BAR ${(3+l*.2).toFixed(1)} rad/s · rhythm gap ${g}px`]);c='m'}else{k=rnd([`HOMING MISSILE tracking y=${(80+Math.random()*200)|0} · speed ${d.speed|0}`,`MISSILE + FIRE-BAR combo · gap ${g}px`]);c=t==3?'n':'h'}}
  else{if(t==0){k=rnd([`SINGLE-LANE BARRIER lane ${(Math.random()*3|0)+1}`,`WIDE POTHOLE lane ${(Math.random()*3|0)+1}`]);c='e'}else if(t==1){k=rnd([`SIDE-SWEEPER crossing lanes · period ${(2+l*.1).toFixed(1)}s`,`DOUBLE-LANE BARRICADE lanes ${rnd(['1+2','2+3','1+3'])}`]);c='m'}else{k=`ONCOMING TRAIN lane ${(Math.random()*3|0)+1} → switches lane at d<${330|0}px · ${d.speed*1.4|0}px/s`;c=t==3?'n':'h'}}
  this.n++;const ts=(this.tm||0).toFixed(1).padStart(5,'0');this.lines.push(`<div class="${c}">[${ts}s] WAVE ${String(this.n).padStart(3,'0')}: ${k}</div>`);if(this.lines.length>80)this.lines.shift();this.tokens.push({x:640,lbl:k.split(' ')[0].slice(0,6),c:{e:'#39ff88',m:'#ffd23f',h:'#ff7a59',n:'#ff2bd6'}[c],y:sub?20+Math.random()*100:110})},
 tick(dt){if(!$('#glog'))return;this.tm=(this.tm||0)+dt;this.t-=dt;const d=diffParams(S.level);if(this.t<=0){this.t=d.spawn/1000;this.wave();const L=$('#glog');L.innerHTML=this.lines.join('');L.scrollTop=L.scrollHeight}
  const cv=$('#gc'),c=cv.getContext('2d');c.fillStyle='#04070f';c.fillRect(0,0,640,150);c.strokeStyle='#16213a';for(let y=30;y<150;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(640,y);c.stroke()}c.fillStyle='#00e5ff';c.fillRect(40,0,2,150);
  for(const k of this.tokens){k.x-=d.speed*dt*.8;c.fillStyle=k.c;c.shadowColor=k.c;c.shadowBlur=8;c.fillRect(k.x,k.y,46,24);c.shadowBlur=0;c.fillStyle='#000';c.font='bold 10px monospace';c.fillText(k.lbl,k.x+3,k.y+15)}this.tokens=this.tokens.filter(k=>k.x>-60)}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g){S.level=+g.dataset.g;save();gen.build()}});document.addEventListener('input',e=>{if(e.target.hasAttribute('data-gs')){S.level=+e.target.value;save();gen.params()}});
// ----- Tab 5: designer studio (blueprint sandbox + profiler)
const studio={sim:null,build(){const el=$('#t-studio');el.innerHTML=`<h2>ALGORITHMIC DESIGN STUDIO — blueprint sandbox & profiler (${S.mode.toUpperCase()})</h2><div class="split"><div><div class="cvwrap" id="sw"><canvas id="sc" width="800" height="340"></canvas><div class="ovl">💥 GAME OVER<small>press R or ↻ RESTART</small></div></div>
  <div class="panel" style="margin-top:10px"><div class="row"><label>REACTION WINDOW</label><b id="rw" style="color:var(--cy)">-- ms</b></div><div class="react"><i id="rb"></i></div><div class="mu" style="margin-top:6px">Countdown to the nearest hazard at the current velocity: lower = harder.</div></div></div><div><div id="sside"></div><div class="panel" style="margin-top:10px"><h2>DATA VARIABLE PROFILER</h2><table class="kv" id="prof"></table></div></div></div>`;
  const old=this.sim;this.sim=new Sim($('#sc'),$('#sw'),{bot:old?old.o.bot:true,ko:old?old.o.ko:false,chain:old?old.o.chain:false,types:old?old.o.types:{},auto:false});this.side()},
 side(){controls(this.sim,$('#sside'),{id:'st',chain:true,after:()=>{}})},
 tick(){const s=this.sim;if(!s)return;const P=s.P(),n=s.nearest(),d=$('#st-dg');if(d)d.style.width=s.danger()+'%';
  const max=Math.max(200,diffParams(1).react*1.3),w=n==null?100:clamp(n/max*100,0,100);const rb=$('#rb');if(rb){rb.style.width=w+'%';rb.style.background=w<30?'#ff1744':w<60?'#ffd23f':'#00e5ff';$('#rw').textContent=n==null?'-- ms':n+' ms'}
  $('#prof').innerHTML=[['mode',S.mode],['spawn pattern',s.o.chain?'chained combos':'random'],['consequence',s.o.ko?'1-hit KO':'HP '+Math.max(0,s.hp|0)+'/100'],['scroll speed',(P.speed|0)+' px/s'],['spawn interval',(P.spawn|0)+' ms'],['safe gap',(P.gap|0)+' px'],['min reaction (gap/speed)',Math.round(P.gap/P.speed*1000)+' ms'],['damage per hit',(P.dmg|0)],['multiplier','×'+s.mult.toFixed(1)],['obstacles live',s.obs.length],['dodged',s.dodged],['danger',s.danger()+'%']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}};
// ---------- 5. MAIN LOOP ----------
function renderAll(){renderTraps();play.build();renderShop();gen.build();studio.build();head();ACTIVE=S.tab=='play'?play.sim:S.tab=='studio'?studio.sim:null}
let last=performance.now(),accT=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(S.tab=='play'&&play.sim){play.sim.update(dt);play.sim.draw();play.tick()}
 else if(S.tab=='studio'&&studio.sim){studio.sim.update(dt);studio.sim.draw();studio.tick()}
 else if(S.tab=='gen')gen.tick(dt)}
(()=>{renderAll();showTab();requestAnimationFrame(frame)})();
// When this page runs INSIDE the Bounce game (iframe), HOME becomes 'back to game' and tells the parent to close the overlay.
if(window.parent!==window){const h=$('#homeLink');h.textContent='◀ BACK TO GAME';h.addEventListener('click',e=>{e.preventDefault();try{parent.postMessage({gh:'home'},'*')}catch(x){}})}
</script></body></html>
