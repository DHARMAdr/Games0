<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spacewar Infinity</title>
<!-- FLAT BUILD: every file is in ONE folder: sw-style/menu/game/effects.css + sw-*.js + storage.js (hub scores) -->
<!-- 4 stylesheets: base, menus, in-game HUD/touch, visual effects -->
<style>/* inlined sw-style.css */
/* BASE STYLES: colours (CSS variables), page layout and accessibility modes toggled by settings.js via classes on <body>. */
:root{--cy:#00e5ff;--bl:#2979ff;--vi:#7c4dff;--mg:#ff2bd6;--bg:#03040d;--panel:#0a1030cc;--tx:#e8f4ff;--ui:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Orbitron","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
canvas#game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #00e5ff33,0 0 0 1px #00e5ff44;background:#000;z-index:1}
.hidden{display:none!important}
body.hc{--tx:#fff;--panel:#000}body.hc .btn{border-color:#fff;background:#000}body.hc #space{opacity:.2}
body.big{font-size:118%}body.noMotion *{animation:none!important;transition:none!important}

</style><style>/* inlined sw-menu.css */
/* MENUS: one overlay (#screen) whose content is rebuilt by ui.js. */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 40%,#0a1a4a88,#02030acc);overflow-y:auto;touch-action:pan-y;zoom:var(--ui)}
.screen h1{font-size:2.2rem;font-size:clamp(1.8rem,7vw,3.6rem);margin:0;letter-spacing:.12em;background:linear-gradient(180deg,#fff,#7fdcff 45%,#7c4dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #00e5ff);animation:reveal 1.6s ease both}
.screen h2{margin:4px 0;letter-spacing:.1em;color:var(--cy);text-shadow:0 0 12px var(--cy)}.sub{letter-spacing:.3em;font-size:.75rem;color:#9bb;margin:0 0 10px;animation:reveal 2.2s ease both}
.menu{display:flex;flex-direction:column;gap:8px;width:86vw;max-width:320px}
.btn{font:inherit;font-weight:700;letter-spacing:.08em;color:var(--tx);background:linear-gradient(180deg,#14246acc,#0a1236cc);border:1px solid var(--cy);border-radius:4px;padding:11px 16px;cursor:pointer;box-shadow:0 0 10px #00e5ff44,inset 0 0 12px #00e5ff22;transition:.15s;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn:hover,.btn:focus{transform:translateX(4px) scale(1.02);box-shadow:0 0 22px var(--cy);outline:0;background:linear-gradient(180deg,#1b3a9a,#0c1a5a)}
.btn.primary{border-color:var(--mg);box-shadow:0 0 14px #ff2bd666}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:.8rem}
.panel{background:var(--panel);border:1px solid #00e5ff55;border-radius:8px;padding:12px;width:94vw;max-width:560px;max-height:62vh;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.card{border:1px solid #2a4a9a;border-radius:8px;padding:8px;text-align:center;font-size:.8rem;background:#0a1236}.card.sel{border-color:var(--mg);box-shadow:0 0 12px var(--mg)}.card.lock{opacity:.5}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff14;font-size:.85rem}.set h3{margin:10px 0 2px;color:var(--vi)}
.set input[type=range]{width:45%}.set select{background:#0a1236;color:var(--tx);border:1px solid var(--cy);padding:3px}
.prog{height:6px;background:#223;border-radius:3px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}table{width:100%;font-size:.85rem}td,th{padding:4px;text-align:left}
#toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);z-index:40;background:#0a1236;border:1px solid var(--mg);padding:8px 16px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
@keyframes reveal{from{opacity:0;letter-spacing:.6em;filter:blur(12px)}}

</style><style>/* inlined sw-game.css */
/* HUD + touch controls. HUD is positioned over the canvas; pointer-events are off so it never blocks the game. */
#hud{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;pointer-events:none;padding:env(safe-area-inset-top) 10px 0;font-size:.8rem;text-shadow:0 0 6px #000;zoom:var(--ui)}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:6px}#hud .small{font-size:.7rem;color:#9cf;justify-content:center;gap:14px}
.bars{width:34vw;max-width:200px}.bar{height:11px;background:#0008;border:1px solid #fff4;margin-bottom:3px;border-radius:3px;overflow:hidden}.bar b{display:block;height:100%}
.hp b{background:linear-gradient(90deg,#ff5252,#ff8a80)}.sh b{background:linear-gradient(90deg,#2979ff,#00e5ff)}.sp b{background:linear-gradient(90deg,#7c4dff,#ff2bd6)}.boss b{background:linear-gradient(90deg,#ff1744,#ff9100)}
.mid{text-align:center}#hScore{font-size:1.5rem;color:var(--cy);text-shadow:0 0 10px var(--cy)}.right{text-align:right}#pauseBtn{pointer-events:auto;font-size:1.2rem;background:#0a1236;color:#fff;border:1px solid var(--cy);border-radius:6px;padding:4px 10px;cursor:pointer}
#hBoss{text-align:center;margin:4px auto;width:60vw;max-width:420px}#hBoss .bar{height:14px}#hObj{text-align:center;color:#ffd740;font-size:.72rem}#hPow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:3px}#hPow span{background:#0a1236cc;border:1px solid var(--vi);padding:1px 6px;border-radius:10px;font-size:.7rem}
#hFps{position:absolute;bottom:6px;left:8px;color:#8f8}#hTip{position:absolute;bottom:18%;width:100%;left:0;text-align:center;color:#fff9;font-size:.85rem}
/* touch controls */
#touch{position:fixed;top:0;right:0;bottom:0;left:0;z-index:12;pointer-events:none}#joyZone{position:absolute;left:0;bottom:0;width:48vw;height:46vh;pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;width:70px;height:70px;border-radius:50%;background:#00e5ff44;border:2px solid var(--cy);display:none}
#tBtns{position:absolute;right:10px;bottom:14px;right:max(10px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,78px);gap:10px;pointer-events:auto}
#tBtns button{height:78px;border-radius:50%;font:700 .7rem inherit;color:#fff;background:#0a1236cc;border:2px solid var(--cy);touch-action:none}#bFire{grid-column:1/3;height:92px!important;width:92px;justify-self:end;border-color:var(--mg)!important}

</style><style>/* inlined sw-effects.css */
/* VISUAL EFFECTS built with CSS only: star layers, nebula, scanlines (optional) and the damage flash. */
#space{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;overflow:hidden}#space i{position:absolute;top:-100%;right:0;bottom:0;left:0;background-repeat:repeat}
#space .l1{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#9cf,transparent),radial-gradient(1px 1px at 160px 60px,#fff,transparent);background-size:200px 200px;animation:fall 40s linear infinite;opacity:.5}
#space .l2{background-image:radial-gradient(1.6px 1.6px at 50px 80px,#fff,transparent),radial-gradient(1.6px 1.6px at 130px 20px,#c9f,transparent);background-size:260px 260px;animation:fall 22s linear infinite;opacity:.7}
#space .l3{background-image:radial-gradient(2.2px 2.2px at 70px 40px,#fff,transparent);background-size:340px 340px;animation:fall 12s linear infinite}
#space .neb{background:radial-gradient(ellipse at 20% 30%,#7c4dff44,transparent 50%),radial-gradient(ellipse at 80% 70%,#ff2bd633,transparent 50%),radial-gradient(ellipse at 60% 10%,#00e5ff22,transparent 45%)}
@keyframes fall{to{transform:translateY(100%)}}
#flash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:15;background:#f33;opacity:0;pointer-events:none;transition:opacity .25s}#flash.on{opacity:.35;transition:none}
.scan{position:fixed;top:0;right:0;bottom:0;left:0;z-index:16;pointer-events:none;display:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px)}body.crt .scan{display:block}body.noFlash #flash{display:none}

/* HOME button back to the hub (flat build) */
#homeBtn{position:fixed;left:8px;top:8px;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:30;font:700 12px 'Courier New',monospace;letter-spacing:2px;color:#39ff88;border:1px solid #39ff88;background:#04140acc;padding:5px 10px;border-radius:4px;text-decoration:none;text-shadow:0 0 8px #39ff88;box-shadow:0 0 10px #39ff8844}#homeBtn:hover{background:#39ff88;color:#000}

</style>
</head><body>
<!-- CSS-only animated space behind the canvas (parallax star layers + nebula) -->
<div id="space"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="neb"></i></div>
<!-- The game world is drawn on ONE canvas (600x800 logical pixels), scaled to fit the window by main.js -->
<canvas id="game"></canvas>
<a id="homeBtn" href="#" data-home-link title="Back to Game Hub">⏻ HOME</a><div id="flash"></div><div class="scan"></div>
<!-- HUD: plain HTML on top of the canvas; game.js updates the text every frame -->
<div id="hud" class="hidden">
 <div class="row"><div class="bars"><div class="bar hp"><b id="hHp"></b></div><div class="bar sh"><b id="hSh"></b></div><div class="bar sp"><b id="hSp"></b></div></div>
  <div class="mid"><div id="hScore">0</div><small>HI <span id="hHi">0</span> · x<span id="hCombo">1</span></small></div>
  <div class="right"><button id="pauseBtn" aria-label="Pause">⏸</button><div id="hLives"></div></div></div>
 <div class="row small"><span id="hLevel"></span><span id="hWave"></span><span id="hKills"></span><span id="hWeapon"></span></div>
 <div id="hBoss" class="hidden"><span id="hBossName"></span><div class="bar boss"><b id="hBossBar"></b></div></div>
 <div id="hObj"></div><div id="hPow"></div><div id="hFps"></div><div id="hTip"></div>
</div>
<!-- Touch controls (shown on touch devices or when forced in Settings) -->
<div id="touch" class="hidden"><div id="joyZone"><div id="joyKnob"></div></div>
 <div id="tBtns"><button id="bFire">FIRE</button><button id="bSpecial">SPECIAL</button><button id="bDash">DASH</button><button id="bSec">MISSILE</button></div></div>
<div id="screen" class="screen hidden"></div><div id="toast"></div>
<noscript>Spacewar Infinity needs JavaScript.</noscript>
<!-- Classic scripts (no modules) so index.html works when opened directly from disk. ORDER MATTERS: each file only uses files above it. -->
<script>/* inlined compat.js */
/* compat.js — makes every page friendlier on ALL devices (desktop, laptop, tablet, phone AND button/keypad phones).
   WHY: older browsers (e.g. KaiOS/Firefox 48, old iOS) lack newer features, and keypad phones have no mouse, touch or full keyboard.
   HOW: (1) GH.LITE flag for weak devices  (2) a visible error banner instead of a silent blank page  (3) KEYPAD MAP: 2/4/6/8 = arrows, 5 = Enter/Jump, 0 = Space,
        soft-left / Back / * = Esc (pause), soft-right = Enter, # = R(restart)  (4) arrow-key focus navigation in menus  (5) GH.hold(): press-and-hold buttons that work with Pointer Events OR touch+mouse.
   Plain ES6 only (no async/await, no ?. , no object spread) so it runs on old engines.   IMPROVE: add more key layouts, a gamepad->keys bridge. */
(function(){
  var UA=navigator.userAgent||'',GH=window.GH=window.GH||{};
  GH.LITE=/KaiOS|Opera Mini|Nokia|Series ?40|Symbian|UCBrowser|NetFront|MIDP|Maemo/i.test(UA)||(Math.min(screen.width||999,screen.height||999)<=360&&!('ontouchstart' in window));
  // ---- (2) error banner: tell the user what is wrong instead of showing nothing
  window.addEventListener('error',function(e){var b=document.getElementById('gh-err');if(!b){b=document.createElement('div');b.id='gh-err';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#500;color:#fff;font:12px monospace;padding:6px;text-align:center';(document.body||document.documentElement).appendChild(b)}
    b.textContent='Warning: '+(e.message||'script error')+' - please use an up-to-date browser (Chrome, Firefox, Safari or Edge).'});
  // ---- (3) keypad / old-browser key translation
  var CODE={37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',13:'Enter',27:'Escape',32:'Space',16:'ShiftLeft',8:'Backspace'};
  function codeOf(e){if(e.code)return e.code;if(CODE[e.keyCode])return CODE[e.keyCode];if(e.keyCode>=65&&e.keyCode<=90)return 'Key'+String.fromCharCode(e.keyCode);if(e.keyCode>=48&&e.keyCode<=57)return 'Digit'+(e.keyCode-48);if(e.keyCode>=96&&e.keyCode<=105)return 'Numpad'+(e.keyCode-96);return''}
  function overlayOpen(){var ids=['ov','ui','screen','frame'];for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el&&el.offsetWidth>0&&getComputedStyle(el).display!=='none'&&!el.classList.contains('hidden')&&!el.classList.contains('hide'))return el}return null}
  GH.overlayOpen=overlayOpen;
  var KEYPAD={'2':'ArrowUp','8':'ArrowDown','4':'ArrowLeft','6':'ArrowRight','0':'Space','#':'KeyR','*':'Escape','SoftLeft':'Escape','SoftRight':'Enter','Backspace':'Escape','EndCall':'Escape'};
  var KP=GH.LITE||(window.matchMedia&&matchMedia('(pointer:none)').matches)||/[?&]keypad=1/.test(location.search);try{if(localStorage.getItem('gh_keypad')==='1')KP=true}catch(x){}
  GH.keypad=KP;try{var hc=document.documentElement;hc.className+=(KP?' kp':'')+(GH.LITE?' lite':'')}catch(x){}   // keypad mode: auto on for keypad phones, or switch it on in the hub profile panel (gh_keypad)
  function target(e){var k=e.key,c=codeOf(e),tag=(e.target&&e.target.tagName)||'',typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tag),isNum=/^Numpad[0-9]$/.test(c);
    if(typing&&k!=='SoftLeft'&&k!=='SoftRight')return null;      // never steal typing in text boxes
    if(isNum)k=c.charAt(6);                                       // numpad digits always work (2/4/6/8/5)
    var digit=/^[0-9]$/.test(k);if(digit&&!(KP||isNum))return null;
    if((k==='*'||k==='#'||k==='Backspace'||k==='EndCall')&&!KP)return null;
    if(k==='5')return overlayOpen()?'Enter':'Space';
    return KEYPAD[k]||null}
  function synth(type,code,orig){var ev;try{ev=new KeyboardEvent(type,{key:code.indexOf('Key')===0?code.slice(3).toLowerCase():code,code:code,bubbles:true,cancelable:true})}catch(x){return}
    try{Object.defineProperty(ev,'__gh',{value:1})}catch(x){}window.dispatchEvent(ev)}
  function onKey(e){if(e.__gh)return;var t=target(e);
    if(t){e.stopImmediatePropagation();e.preventDefault();if(e.repeat&&e.type==='keydown')return;synth(e.type,t,e);return}
    if(!e.code){var c=codeOf(e);if(c){e.stopImmediatePropagation();synth(e.type,c,e)}}}
  window.addEventListener('keydown',onKey,true);window.addEventListener('keyup',onKey,true);
  // ---- (4) menu focus navigation with arrows (keypad D-pad). Games keep their own arrow handling; this only moves the focus ring in open menus.
  function visible(el){return el.offsetWidth>0&&el.offsetHeight>0&&!el.disabled}
  function list(root){var a=root.querySelectorAll('button,a[href],input,select,[tabindex]'),out=[];for(var i=0;i<a.length;i++)if(visible(a[i]))out.push(a[i]);return out}
  window.addEventListener('keydown',function(e){var c=e.code;if(c!=='ArrowUp'&&c!=='ArrowDown'&&c!=='ArrowLeft'&&c!=='ArrowRight')return;
    var ov=overlayOpen(),root=ov||(document.body.hasAttribute('data-nav')?document.body:null);if(!root)return;
    var ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&(c==='ArrowLeft'||c==='ArrowRight'))return;
    var items=list(root);if(!items.length)return;var i=items.indexOf(ae);var d=(c==='ArrowDown'||c==='ArrowRight')?1:-1;i=i<0?(d>0?0:items.length-1):(i+d+items.length)%items.length;items[i].focus();e.preventDefault&&e.preventDefault()},false);
  // ---- (5) press/hold helpers that work with Pointer Events (modern) or touch+mouse (old iOS/Android)
  GH.hold=function(el,down,up){if(!el)return;var on=function(e){if(e.cancelable)e.preventDefault();down(e)},off=function(e){if(up)up(e)};
    if(window.PointerEvent){el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(function(t){el.addEventListener(t,off)})}
    else{el.addEventListener('touchstart',on);el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off)}};
  GH.xy=function(e){var t=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e;return{x:t.clientX,y:t.clientY}};
  // base64(UTF-8) -> string for embedded pages (works in old browsers too)
  GH.b64=function(b){return decodeURIComponent(escape(atob(b)))};
})();

</script><script>/* inlined storage.js */
// WHY: ONE storage layer shared by hub AND games, so cloud sync later = change one object.
// HOW: `Store.backend` exposes get/set that return Promises (so a cloud backend can be async). Default = browser localStorage (no server).
// Written with plain Promises (no async/await) so it also runs on older browsers.  IMPROVE: write a cloud backend and do `Store.backend=cloud`.
const Store={
  backend:{get(k){var v=null;try{v=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}return Promise.resolve(v)},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return Promise.resolve()}},
  // PIN hashing (SHA-256 when available, small fallback hash otherwise). IMPROVE: salt + server-side hashing; 6-digit PINs are weak.
  hash(p){var fb=function(){var h=0,t='gh:'+p;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'f'+h};
    try{if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode('gh:'+p)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')},function(){return fb()})}catch(e){}
    return Promise.resolve(fb())},
  users(){return this.backend.get('gh_users').then(function(u){return u||{}})},
  user(){return localStorage.getItem('gh_session')},
  signUp(id,pin){var self=this;id=id.trim().toLowerCase();if(!id||!/^\d{6}$/.test(pin))return Promise.resolve('Need a name/email and a 6-digit PIN');
    return self.users().then(function(u){if(u[id])return 'Name already used';return self.hash(pin).then(function(h){u[id]={pin:h,hist:{}};return self.backend.set('gh_users',u).then(function(){localStorage.setItem('gh_session',id);return ''})})})},
  signIn(id,pin){var self=this;id=id.trim().toLowerCase();return self.users().then(function(u){if(!u[id])return 'Wrong name or PIN';return self.hash(pin).then(function(h){if(u[id].pin!==h)return 'Wrong name or PIN';localStorage.setItem('gh_session',id);return ''})})},
  signOut(){localStorage.removeItem('gh_session')},
  // Games call this at game over: keeps best + last 20 plays per game for the profile history.
  saveScore(game,score){var self=this,id=self.user();if(!id)return Promise.resolve();return self.users().then(function(u){if(!u[id])return;var h=u[id].hist[game]||(u[id].hist[game]={best:0,plays:[]});h.best=Math.max(h.best,score);h.plays.unshift({s:score,t:Date.now()});h.plays.length=Math.min(h.plays.length,20);return self.backend.set('gh_users',u)})}
};

// ===== SHARED DIFFICULTY. WHY: ONE setting (chosen in the hub or any game menu) changes speed, trap density, spacing, damage and lives in every game.
// HOW: Store.diff() returns the numbers of the chosen level. spd=speed x, spawn=trap density x, gap=spacing x, dmg=damage x, lives, chase=guard window (frames), ko=1-hit KO, sw=lane-switching trains, missile=homing-missile interval (frames, 0=off).
// IMPROVE: per-game overrides, custom difficulty sliders, unlockable "Insane" tier.
Store.DIFFS={easy:{n:'EASY',spd:.85,spawn:.75,gap:1.25,dmg:.7,lives:7,chase:300,ko:false,sw:false,missile:0},
 normal:{n:'NORMAL',spd:1,spawn:1,gap:1,dmg:1,lives:5,chase:480,ko:false,sw:false,missile:0},
 hard:{n:'HARD',spd:1.15,spawn:1.3,gap:.85,dmg:1.3,lives:4,chase:720,ko:false,sw:true,missile:480},
 nightmare:{n:'NIGHTMARE',spd:1.3,spawn:1.6,gap:.7,dmg:2,lives:3,chase:0,ko:true,sw:true,missile:300}};
Store.diffKey=()=>{const k=localStorage.getItem('gh_diff');return Store.DIFFS[k]?k:'normal'};
Store.diff=()=>Store.DIFFS[Store.diffKey()];
Store.setDiff=k=>{if(Store.DIFFS[k])localStorage.setItem('gh_diff',k)};

</script><script>/* inlined sw-storage.js */
// storage.js — creates the shared namespace SW (every file attaches itself to it) and wraps localStorage.
// WHY: all saving goes through here so bad/missing data never crashes the game. Scores are LOCAL only (not shared online, not cheat-proof).
var SW=window.SW=window.SW||{};
SW.Storage={
  KEY:'spacewarInfinity.',
  getJSON(k,d){try{const v=JSON.parse(localStorage.getItem(this.KEY+k));return v===null||v===undefined?d:v}catch(e){return d}},
  setJSON(k,v){try{localStorage.setItem(this.KEY+k,JSON.stringify(v));return true}catch(e){return false}},
  // Default save file. Unknown/invalid fields in an old save are ignored and replaced by these.
  defaults(){return{credits:0,upgrades:{},ship:'interceptor',ships:['interceptor'],special:'emp',unlocked:1,completed:{},best:{},scores:[],missions:{},ach:{},endlessBest:0,totals:{kills:0,bosses:0,pickups:0,specials:0,levels:0}}},
  load(){const d=this.defaults(),r=this.getJSON('save',{});
    if(r&&typeof r=='object')for(const k in d)if(typeof r[k]==typeof d[k]&&Array.isArray(r[k])==Array.isArray(d[k]))d[k]=r[k];

    case'kamikaze':{const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;e.vx+=dx/l*420*d;e.vy+=dy/l*420*d;const s=Math.hypot(e.vx,e.vy),m=290*dif.spd;if(s>m){e.vx*=m/s;e.vy*=m/s}e.x+=e.vx*d;e.y+=e.vy*d;e.ang=Math.atan2(e.vx,e.vy);
      if(l<46&&!p.dead){g.explodeAt(e.x,e.y,90,22*dif.dmg);e.dead=true}}break;
    case'sniper':if(e.y<70)e.y+=90*d;else{e.x+=Math.sign(p.x-e.x)*40*d;e.stT+=d;
        if(e.st==0){if(e.stT<1.1)e.ang=toP();e.chg=Math.min(1,e.stT/1.4);if(e.stT>=1.4){g.eShot(e.x,e.y+16,e.ang,760*dif.spd,30*dif.dmg,{r:4,col:'#f4f'});e.st=1;e.stT=0;e.chg=0}}   // visible charge line, then precise shot
        else if(e.stT>1.8){e.st=0;e.stT=0}}break;
    case'cruiser':if(e.y<120)e.y+=50*d;else e.x=e.x0+Math.sin(e.t*.5)*70;e.shOn=(e.t%5)<3;                                   // temporary shield: 80% damage reduction while on
      if(e.cd<=0&&e.y>40){g.eShot(e.x-14,e.y+22,0,260*dif.spd,8*dif.dmg);g.eShot(e.x+14,e.y+22,0,260*dif.spd,8*dif.dmg);g.eShot(e.x,e.y+22,toP(),240*dif.spd,8*dif.dmg);e.cd=1.8*dif.fire}break;
    case'phantom':{e.y+=20*d;const t0=e.t%5,cyc=Math.floor(e.t/5);
      if(cyc!=e.cyc){e.cyc=cyc;e.x=Math.max(40,Math.min(560,p.x+(Math.random()-.5)*240));e.y=80+Math.random()*180;e.fireT=.6}                // reappear near the player, then attack
      e.alpha=t0<2?1:t0<2.5?1-(t0-2)*1.7:t0<4?.15:.15+(t0-4)*.85;if(e.fireT>0&&(e.fireT-=d)<=0){const a=toP();for(let i=-1;i<=1;i++)g.eShot(e.x,e.y+14,a+i*.2,280*dif.spd,8*dif.dmg)}}break;
    case'carrier':if(e.y<90)e.y+=40*d;else e.x=e.x0+Math.sin(e.t*.4)*80;if(e.cd<=0&&e.y>60){if(g.enemies.filter(k=>k.parent===e).length<4)g.spawnEnemy('scout',e.x,e.y+20,{parent:e});e.cd=3.5*dif.fire}break;
    case'elite':if(e.y<120)e.y+=50*d;else e.x=300+Math.sin(e.t*.7+e.ph)*200;{const pat=Math.floor(e.t/3)%3;
      if(e.cd<=0&&e.y>60){if(pat==0){const a=toP();for(let i=-2;i<=2;i++)g.eShot(e.x,e.y+20,a+i*.15,320*dif.spd,9*dif.dmg);e.cd=.9*dif.fire}
        else if(pat==1){for(let i=0;i<12;i++)g.eShot(e.x,e.y,i*.5236+e.t,200*dif.spd,8*dif.dmg);e.cd=1.2*dif.fire}else{g.eShot(e.x,e.y+10,Math.sin(e.t*4)*1.5,260*dif.spd,7*dif.dmg);e.cd=.1*dif.fire}}}break;
    case'anomaly':e.x=300+Math.cos(e.t*.8+e.ph)*170;e.y=230+Math.sin(e.t*1.3+e.ph)*90;
      if(e.cd<=0){g.hazard({k:'circle',x:p.x,y:p.y,r:80,tele:.9,t:.25,dmg:22*dif.dmg});for(let i=0;i<8;i++)g.eShot(e.x,e.y,i*.785+e.t,170*dif.spd,7*dif.dmg);e.cd=3.2*dif.fire}break}},
  draw(c,e,g){const t=this.T[e.type],r=e.r,gl=SW.Settings.get('glow');c.save();c.translate(e.x,e.y);c.globalAlpha=e.alpha;
    if(e.type=='anomaly'){const gr=c.createRadialGradient(0,0,2,0,0,r);gr.addColorStop(0,'#fff');gr.addColorStop(.4,t.col);gr.addColorStop(1,'#40006000');c.fillStyle=gr;c.shadowColor=t.col;c.shadowBlur=16*gl;c.beginPath();c.arc(0,0,r*(1+.1*Math.sin(e.t*6)),0,6.283);c.fill();c.strokeStyle=t.col;c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.arc(0,0,r*.8+i*5,e.t*(1+i)+i,e.t*(1+i)+i+2.2);c.stroke()}}
    else{c.rotate(e.type=='kamikaze'?-e.ang+3.1416:0);const gr=c.createLinearGradient(0,-r,0,r);gr.addColorStop(0,t.col);gr.addColorStop(1,'#101830');const path=()=>{c.beginPath();t.pts.forEach((q,i)=>i?c.lineTo(q[0]*r,q[1]*r):c.moveTo(q[0]*r,q[1]*r));c.closePath()};
      c.fillStyle=gr;c.shadowColor=t.col;c.shadowBlur=10*gl;path();c.fill();c.shadowBlur=0;c.strokeStyle=t.col;c.lineWidth=1.5;c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(0,r*.25,r*.13,0,6.283);c.fill();
      if(e.type=='carrier'){c.fillStyle='#ff0';for(const o of[-.7,0,.7])c.fillRect(o*r-3,r*.3,6,4)}if(e.flash>0){c.globalAlpha=.7;c.fillStyle='#fff';path();c.fill()}}
    c.restore();
    if(e.type=='cruiser'&&e.shOn){c.strokeStyle='#5df';c.globalAlpha=.6;c.lineWidth=3;c.beginPath();c.arc(e.x,e.y,r+10,0,6.283);c.stroke();c.globalAlpha=1}
    if(e.type=='sniper'&&e.chg>0){c.strokeStyle='rgba(255,70,200,'+(.2+e.chg*.7)+')';c.lineWidth=1+e.chg*2;c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.x+Math.sin(e.ang)*900,e.y+Math.cos(e.ang)*900);c.stroke()}
    if(e.hp<e.maxhp&&e.maxhp>90){c.fillStyle='#0008';c.fillRect(e.x-r,e.y-r-10,r*2,4);c.fillStyle='#f55';c.fillRect(e.x-r,e.y-r-10,r*2*Math.max(0,e.hp/e.maxhp),4)}}
};

<script>/* inlined sw-bosses.js */

//  move(b,dt,g)  default movement;   pats(b) -> list of attack patterns {n,dur,f(b,dt,g,first)} chosen by phase;   phases(hpRatio) -> phase number;   draw(c,b)
// The generic update() runs patterns in order. Powerful attacks first show a TELEGRAPH (g.hazard with tele>0 = red warning), and each boss has VULNERABLE windows (b.vuln=true = takes +50% damage).

SW.Bosses={
  D:{
    warden:{name:'SOLAR WARDEN',hp:1700,w:220,h:90,ty:130,col:'#ffb35a',phases:r=>r<.5?1:0,

        {n:'volley',dur:2.4,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.5/s;const a=g.aim(b.x,b.y+40);for(let k=-1;k<=1;k++)g.eShot(b.x,b.y+50,a+k*.18,300*s,9*g.dif.dmg)}}},
        {n:'arc',dur:2,f(b,dt,g,first){if(first||b.phase&&b.pt>1&&!b.k2){b.k2=!first;for(let i=0;i<11;i++)g.eShot(b.x,b.y+50,-.8+i*.16,230*s,8*g.dif.dmg)}if(first)b.k2=false}},
        {n:'beam',dur:3.4,f(b,dt,g,first){if(first){g.hazard({k:'rect',x:g.p.x-28,y:0,w:56,h:800,tele:1.1,t:.7,dmg:28*g.dif.dmg});g.sfx('bossHit')}
          if(b.phase&&Math.abs(b.pt-1.2)<dt){g.hazard({k:'rect',x:g.p.x-28,y:0,w:56,h:800,tele:.9,t:.6,dmg:28*g.dif.dmg})}b.vuln=b.pt>2.3}}]},
      draw(c,b){const w=b.w/2;let gr=c.createLinearGradient(0,-45,0,45);gr.addColorStop(0,'#ffd9a0');gr.addColorStop(.5,'#b86a2a');gr.addColorStop(1,'#4a2410');c.fillStyle=gr;c.beginPath();c.moveTo(-w,10);c.lineTo(-w*.6,-40);c.lineTo(w*.6,-40);c.lineTo(w,10);c.lineTo(w*.55,45);c.lineTo(-w*.55,45);c.closePath();c.fill();
        c.strokeStyle='#ffe0b0';c.lineWidth=2;c.stroke();c.fillStyle='#5a2a10';for(const o of[-70,70]){c.fillRect(o-10,20,20,34)}c.fillStyle='#ffcc80';c.fillRect(-w*.4,-30,w*.8,8);
        gr=c.createRadialGradient(0,0,2,0,0,22);gr.addColorStop(0,b.vuln?'#fff':'#ffeb3b');gr.addColorStop(1,b.vuln?'#2af':'#f40');c.fillStyle=gr;c.beginPath();c.arc(0,0,16+(b.vuln?4:0),0,6.283);c.fill()}},
    serpent:{name:'NEBULA SERPENT',hp:2400,w:70,h:70,ty:190,col:'#c64dff',phases:r=>r<.5?1:0,
      move(b,dt){if(!b.ov){b.x=300+Math.sin(b.t*.9)*220;b.y=190+Math.sin(b.t*1.7)*70}},
      pats(b){const s=b.phase?1.3:1;return[
        {n:'sweep',dur:4,f(b,dt,g,first){if(first){b.sy=200+Math.random()*260;g.hazard({k:'rect',x:0,y:b.sy-26,w:600,h:52,tele:1,t:.9,dmg:26*g.dif.dmg})}
          b.ov=b.pt<2.4;if(b.pt<1){b.x+=(-90-b.x)*Math.min(1,dt*5);b.y+=(b.sy-b.y)*Math.min(1,dt*5)}else if(b.pt<1.9){b.x=-90+(b.pt-1)/.9*780;b.y=b.sy}else if(b.pt<2.4){b.y+=(180-b.y)*Math.min(1,dt*4);b.x+=(300-b.x)*Math.min(1,dt*3)}b.vuln=b.pt>2.4}},
        {n:'spit',dur:3,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.55/s;const sg=b.segs[(Math.random()*b.segs.length)|0]||b;for(let i=0;i<8;i++)g.eShot(sg.x,sg.y,i*.785+b.t,190*s,7*g.dif.dmg)}}},
        {n:'storm',dur:3,f(b,dt,g,first){if(first)for(let i=0;i<(b.phase?5:4);i++)g.hazard({k:'circle',x:80+Math.random()*440,y:300+Math.random()*420,r:70,tele:1.2,t:.8,dmg:22*g.dif.dmg})}}]},
      draw(c,b,g){const n=b.segs.length;for(let i=n-1;i>=0;i--){const s=b.segs[i],r=26-i*.8;c.save();c.translate(s.x-b.x,s.y-b.y);const gr=c.createRadialGradient(-4,-4,2,0,0,r);gr.addColorStop(0,'#f0b0ff');gr.addColorStop(1,'#4a1070');c.fillStyle=gr;c.beginPath();c.arc(0,0,r,0,6.283);c.fill();c.strokeStyle='#e0a0ff';c.lineWidth=1.5;c.stroke();c.restore()}
        const gr=c.createRadialGradient(0,-6,3,0,0,36);gr.addColorStop(0,b.vuln?'#fff':'#e6a0ff');gr.addColorStop(1,'#5a1a90');c.fillStyle=gr;c.beginPath();c.ellipse(0,0,32,38,0,0,6.283);c.fill();c.fillStyle='#ff0';c.beginPath();c.arc(-12,-6,6,0,6.283);c.arc(12,-6,6,0,6.283);c.fill();c.strokeStyle='#e6a0ff';c.lineWidth=3;c.beginPath();c.moveTo(-14,16);c.lineTo(-8,34);c.moveTo(14,16);c.lineTo(8,34);c.stroke()}},
    dread:{name:'ABYSSAL DREADNOUGHT',hp:3400,w:300,h:110,ty:150,col:'#2a8a7a',phases:r=>r<.5?1:0,
      move(b){b.x=300+Math.sin(b.t*.4)*80},
      pats(b){const s=b.phase?1.2:1;return[
        {n:'turrets',dur:4,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.6/s;b.tt=!b.tt;const tx=b.x+(b.tt?-95:95),ty=b.y+38;g.eShot(tx,ty,g.aim(tx,ty),320*s,9*g.dif.dmg);g.eShot(tx,ty,g.aim(tx,ty)+.12,320*s,9*g.dif.dmg)}}},
        {n:'barrage',dur:3,f(b,dt,g,first){if(first||Math.abs(b.pt-1.5)<dt){const o=Math.random();for(let i=0;i<16;i++)g.eShot(b.x,b.y+30,i*.3927+o,200*s,8*g.dif.dmg)}}},
        {n:'summon',dur:3.2,f(b,dt,g,first){if(first){g.sfx('bossArrive');g.spawnEnemy('interceptor',b.x-90,b.y+60,{x0:150,st:1});g.spawnEnemy('interceptor',b.x+90,b.y+60,{x0:450,st:1})}b.vuln=b.pt>1.5}},
        {n:'cannon',dur:3.6,f(b,dt,g,first){if(first){g.hazard({k:'rect',x:g.p.x-45,y:0,w:90,h:800,tele:1.3,t:.8,dmg:32*g.dif.dmg});if(b.phase){g.hazard({k:'rect',x:100,y:0,w:50,h:800,tele:1.5,t:.7,dmg:26*g.dif.dmg});g.hazard({k:'rect',x:450,y:0,w:50,h:800,tele:1.5,t:.7,dmg:26*g.dif.dmg})}}b.vuln=b.pt>2.4}}]},
      draw(c,b){const w=b.w/2,gr=c.createLinearGradient(0,-55,0,55);gr.addColorStop(0,'#4a6a68');gr.addColorStop(1,'#0a1a1a');c.fillStyle=gr;c.beginPath();c.moveTo(-w,0);c.lineTo(-w*.8,-50);c.lineTo(w*.8,-50);c.lineTo(w,0);c.lineTo(w*.7,55);c.lineTo(-w*.7,55);c.closePath();c.fill();c.strokeStyle='#5fd0b8';c.lineWidth=2;c.stroke();
        for(const o of[-95,95]){c.fillStyle='#183030';c.beginPath();c.arc(o,38,16,0,6.283);c.fill();c.strokeStyle='#5fd0b8';c.stroke();c.fillStyle='#8ff';c.fillRect(o-3,40,6,22)}c.fillStyle=b.vuln?'#fff':'#0ff';c.fillRect(-50,-20,100,14);c.fillStyle='#0a1a1a';c.fillRect(-w*.3,18,w*.6,20)}},
    overlord:{name:'THE INFINITY OVERLORD',hp:5200,w:180,h:180,ty:170,col:'#ff2bd6',phases:r=>r<.33?2:r<.66?1:0,
      move(b){b.x=300+Math.sin(b.t*.6)*(120+b.phase*40);b.y=170+Math.sin(b.t*1.1)*20},
      pats(b){const P=b.phase,s=1+P*.25,rings={n:'rings',dur:3,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.75/s;b.ro=(b.ro||0)+.2;for(let i=0;i<14;i++)g.eShot(b.x,b.y,i*.4488+b.ro,190*s,8*g.dif.dmg)}}},
        aimed={n:'aimed',dur:2.4,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.5/s;const a=g.aim(b.x,b.y);for(let k=-1;k<=1;k++)g.eShot(b.x,b.y+40,a+k*.16,320*s,9*g.dif.dmg)}b.vuln=b.pt>1.4}},
        spiral={n:'spiral',dur:3.5,f(b,dt,g){b.a=(b.a||0)-dt;if(b.a<=0){b.a=.07;b.sp=(b.sp||0)+.35;for(let k=0;k<3;k++)g.eShot(b.x,b.y,b.sp+k*2.094,210*s,7*g.dif.dmg)}}},
        wave={n:'wave',dur:2.5,f(b,dt,g,first){if(first){const gap=60+Math.random()*480;for(let x=20;x<600;x+=36)if(Math.abs(x-gap)>60)g.eShot(x,b.y+70,0,210,8*g.dif.dmg,{r:7,col:'#f8f'})}b.vuln=b.pt>1.5}},
        summon={n:'summon',dur:2.2,f(b,dt,g,first){if(first){g.sfx('bossArrive');for(let i=0;i<3;i++)g.spawnEnemy('scout',150+i*150,-20,{x0:150+i*150})}b.vuln=b.pt>1}},
        beams={n:'beams',dur:3,f(b,dt,g,first){if(first){for(const x of[g.p.x-30,Math.random()*500+40]){g.hazard({k:'rect',x:x-26,y:0,w:52,h:800,tele:1.2,t:.7,dmg:30*g.dif.dmg})}}b.vuln=b.pt>2}};
        return P==0?[rings,aimed,rings,summon]:P==1?[spiral,wave,aimed,summon,rings]:[rings,spiral,beams,wave,aimed,summon,beams]},
      draw(c,b){const P=b.phase,col=['#ff2bd6','#7c4dff','#ffea00'][P],t=b.t;let gr=c.createRadialGradient(0,0,6,0,0,80);gr.addColorStop(0,b.vuln?'#fff':'#ffd0f8');gr.addColorStop(.35,col);gr.addColorStop(1,'#10002a');c.fillStyle=gr;c.shadowColor=col;c.shadowBlur=28*SW.Settings.get('glow');c.beginPath();c.arc(0,0,66+Math.sin(t*5)*3,0,6.283);c.fill();c.shadowBlur=0;
        c.strokeStyle=col;c.lineWidth=3;for(let i=0;i<3+P;i++){c.beginPath();c.arc(0,0,78+i*8,t*(.8+i*.3)+i*2,t*(.8+i*.3)+i*2+1.8);c.stroke()}
        c.fillStyle=col;for(let i=0;i<8;i++){const a=i*.785+t*.4;c.beginPath();c.moveTo(Math.cos(a)*70,Math.sin(a)*70);c.lineTo(Math.cos(a+.12)*100,Math.sin(a+.12)*100);c.lineTo(Math.cos(a+.24)*70,Math.sin(a+.24)*70);c.fill()}

  },
  spawn(id,g){const d=this.D[id],hp=d.hp*g.hpMul;const b={id,d,x:300,y:-200,ty:d.ty,hp,maxhp:hp,w:d.w,h:d.h,r:Math.max(d.w,d.h)*.42,phase:0,t:0,pt:0,pi:0,state:'enter',inv:99,vuln:false,flash:0,dying:0,segs:[],trail:[],name:d.name};

  draw(c,b,g){c.save();if(b.id!='serpent')c.translate(b.x,b.y);else c.translate(b.x,b.y);if(b.inv>0&&b.state=='fight')c.globalAlpha=.55+.3*Math.sin(b.t*30);b.d.draw(c,b,g);
    if(b.flash>0){c.globalAlpha=.4;c.fillStyle='#fff';c.beginPath();c.arc(0,0,b.r,0,6.283);c.fill()}c.restore()}
};

</script><script>/* inlined sw-levels.js */

SW.Levels={
  COST:{scout:1,interceptor:1.5,gunship:3,kamikaze:1,sniper:2,cruiser:3,phantom:2,carrier:4,elite:5,anomaly:4},
  // wave(li, wi, endless): spends a "budget" on random enemies from the level pool. Budget grows with wave number and level, so difficulty rises smoothly.

  wave(li,wi,endless){const L=endless?{pool:Object.keys(this.COST)}:SW.LEVELS[li],pool=L.pool.filter((t,i)=>endless?i<=Math.min(9,2+wi):i<=Math.floor(wi/2)+1),

  event(type,val){for(const list of[SW.MISSIONS,SW.ACH])for(const m of list)if(m.type==type){const s=SW.data.missions[m.id]||(SW.data.missions[m.id]={p:0,done:false});if(s.done)continue;

</script><script>/* inlined sw-game.js */
// game.js — the heart of the game: ONE permanent requestAnimationFrame loop, the central game state, spawning waves, collisions, pickups, abilities, scoring, HUD updates and level flow.

SW.Game={
  W:600,H:800,state:'menu',time:0,last:0,raf:0,fps:0,fpsN:0,fpsT:0,shk:0,
  DIF:{easy:{hp:.8,dmg:.7,fire:1.25,spd:.9},normal:{hp:1,dmg:1,fire:1,spd:1},hard:{hp:1.3,dmg:1.2,fire:.8,spd:1.1},insane:{hp:1.7,dmg:1.5,fire:.65,spd:1.25}},
  ABIL:{emp:{name:'EMP Blast',cost:40},shield:{name:'Energy Shield',cost:35},warp:{name:'Time Warp',cost:50},over:{name:'Overdrive',cost:50},nova:{name:'Nova Bomb',cost:100},repair:{name:'Emergency Repair',cost:60}},
  // Power-ups: col/icon/label + duration (dur, seconds) for timed buffs. Weights decide how often each drops.
  PU:{hp:{c:'#ff5252',i:'+',l:'Health',w:12},shield:{c:'#40c4ff',i:'S',l:'Shield',w:12},invuln:{c:'#ffd740',i:'★',l:'Invulnerable',w:4},dmg:{c:'#ff9100',i:'D',l:'Damage+',w:8},rate:{c:'#69f0ae',i:'R',l:'Fire rate+',w:8},
    rapid:{c:'#ea80fc',i:'»',l:'Rapid fire',w:6},life:{c:'#ff4081',i:'♥',l:'Extra life',w:2},mult:{c:'#ffff00',i:'x2',l:'Score x2',w:6},energy:{c:'#b388ff',i:'E',l:'Energy',w:10},credit:{c:'#fff176',i:'$',l:'Credits',w:14},weapon:{c:'#fff',i:'W',l:'Weapon',w:6},ammo:{c:'#ffab91',i:'A',l:'Ammo',w:8}},
  init(cv){this.cv=cv;this.c=cv.getContext('2d');cv.width=600;cv.height=800;this.pb=[];this.eb=[];this.enemies=[];this.pickups=[];this.rocks=[];this.haz=[];this.q=[];this.boss=null;this.p=null;this.cache={};this.dif=this.DIF.normal;
    SW.BG.init(SW.PALS[0]);this.bound=t=>this.loop(t);if(!this.raf)this.raf=requestAnimationFrame(this.bound)},
  // ---- the one loop. dt is capped (0.05s) so coming back from a hidden tab never makes things jump.
  loop(t){this.raf=requestAnimationFrame(this.bound);let dt=(t-this.last)/1000;this.last=t;if(!(dt>0))dt=0;dt=Math.min(dt,.05);
    this.fpsN++;this.fpsT+=dt;if(this.fpsT>=.5){this.fps=Math.round(this.fpsN/this.fpsT);this.fpsN=0;this.fpsT=0}
    SW.Controls.poll();
    if(this.state=='playing')this.update(dt);else if(this.state!='paused'){SW.BG.update(dt,.7);SW.FX.update(dt);if(this.state=='victory'&&Math.random()<dt*3)SW.FX.burst(80+Math.random()*440,100+Math.random()*300,['#ff2bd6','#00e5ff','#ffea00'][(Math.random()*3)|0],40,260,1.2,3)}
    this.draw();this.hud()},
  sfx(n){SW.Audio.sfx(n)},shake(a){if(SW.Settings.get('shake'))this.shk=Math.max(this.shk,a*SW.Settings.get('shakeAmt'))},
  flash(){const f=document.getElementById('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),90)},
  toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(this.tt);this.tt=setTimeout(()=>t.classList.remove('on'),2200)},
  // ---- level flow ----
  startLevel(idx){SW.UI.hide();this.endless=idx<0;this.idx=idx<0?0:idx;this.data=SW.LEVELS[this.idx];let dk=SW.Settings.get('difficulty');if(dk=='hub')dk={easy:'easy',normal:'normal',hard:'hard',nightmare:'insane'}[typeof Store!=='undefined'&&Store.diffKey?Store.diffKey():'normal']||'normal';this.dif=this.DIF[dk];   // 'hub' follows the hub's shared difficulty
    this.pb.forEach(b=>b.on=false);this.eb.forEach(b=>b.on=false);this.enemies.length=0;this.pickups.length=0;this.rocks.length=0;this.haz.length=0;this.q.length=0;this.boss=null;SW.FX.clear();
    this.score=0;this.kills=0;this.shots=0;this.hits=0;this.time=0;this.combo=0;this.comboT=0;this.maxCombo=0;this.livesLost=0;this.flawless=true;this.bossKills=0;this.runCredits=0;this.pickN=0;this.wi=0;this.ph='intro';this.wt=2.2;this.tsT=0;this.ts=1;this.envT=3;this.bossDone=false;this.tipT=0;
    this.hpMul=this.dif.hp*(1+.07*this.idx);this.p=SW.Player.create(this);this.p.energy=100;
    SW.BG.init(SW.PALS[this.data.w]);SW.BG.warp=1;SW.Audio.setWorld(this.data.w);SW.Audio.resume();SW.Audio.pause(false);SW.Controls.clear();this.state='playing';this.toast(this.endless?'ENDLESS SURVIVAL':'LEVEL '+(this.idx+1)+': '+this.data.n);document.getElementById('hud').classList.remove('hidden')},
  pause(){if(this.state!='playing')return;this.state='paused';SW.Audio.pause(true);SW.Controls.clear();SW.UI.show('pause')},
  resume(){if(this.state!='paused')return;SW.UI.hide();this.state='playing';SW.Audio.pause(false);SW.Controls.clear()},
  autoPause(){if(this.state=='playing'&&SW.Settings.get('pauseBlur'))this.pause()},
  toMenu(){this.state='menu';document.getElementById('hud').classList.add('hidden');this.boss=null;SW.Audio.pause(false);SW.BG.init(SW.PALS[0]);SW.UI.show('main')},
  onKey(code){const C=SW.Controls;if(C.map.pause.includes(code)){if(this.state=='playing')this.pause();else SW.UI.back()}else if(C.map.confirm.includes(code)&&this.state!='playing')SW.UI.enter()},
  // ---- entity helpers (used by weapons / enemies / bosses) ----
  bullet(arr,cap){for(const b of arr)if(!b.on)return b;if(arr.length<cap){const b={};arr.push(b);return b}return null},       // object pool: reuse inactive bullets
  pShot(x,y,vx,vy,dmg,o){o=o||{};const b=this.bullet(this.pb,320);if(!b)return;const st=this.p.st,crit=Math.random()<st.crit,k=o.homing?1:st.proj;
    Object.assign(b,{on:true,x,y,vx:vx*k,vy:vy*k,dmg:crit?dmg*2:dmg,crit,r:o.r||4,life:o.life||1.4,col:o.col||'#4df',pierce:o.pierce||0,hits:[],splash:o.splash||0,homing:o.homing||0,accel:o.accel||0,len:o.len||0,age:0,assist:!o.homing&&!o.accel&&!o.splash&&Math.abs(vx)<250})},
  eShot(x,y,ang,sp,dmg,o){o=o||{};const b=this.bullet(this.eb,520);if(!b)return;Object.assign(b,{on:true,x,y,vx:Math.sin(ang)*sp,vy:Math.cos(ang)*sp,dmg,r:o.r||5,col:o.col||'#ff5a3c'})},
  aim(x,y){return Math.atan2(this.p.x-x,this.p.y-y)},
  targets(){return this.boss&&this.boss.state=='fight'&&!this.boss.dying?this.enemies.concat([this.boss]):this.enemies},
  nearest(x,y,max){let b=null,bd=max;for(const t of this.targets()){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;b=t}}return b},
  spawnEnemy(type,x,y,o){this.enemies.push(SW.Enemies.make(type,x,y,this,o))},
  hazard(h){h.age=0;h.hit=false;this.haz.push(h)},
  clearBullets(){this.eb.forEach(b=>b.on=false)},
  explodeAt(x,y,r,d){SW.FX.burst(x,y,'#fa4',34,260,.7,3);SW.FX.ring(x,y,'#fa4',r);this.sfx('explode');this.shake(6);if(Math.hypot(this.p.x-x,this.p.y-y)<r)SW.Player.hit(this.p,d,this)},
  // dmg(): damage anything (enemy, boss, rock). Handles shields, armor, vulnerable boss windows, damage numbers and kills.
  dmg(t,d,crit){if(t.dead)return;const col=crit?'#ffea00':'#fff';
    if(t.d){if(t.inv>0||t.state=='enter'||t.dying)return;if(t.vuln)d*=1.5;t.hp-=d;t.flash=.08;SW.FX.text(t.x+(Math.random()-.5)*60,t.y+20,Math.round(d),col);this.sfx('bossHit');this.p.special=Math.min(100,this.p.special+.15);
      if(t.hp<=0){t.hp=0;t.dying=.001;this.clearBullets();this.sfx('bossDie');this.shake(14)}return}
    if(t.rock){t.hp-=d;if(t.hp<=0){t.dead=true;SW.FX.burst(t.x,t.y,'#a98',16,160,.6);this.score+=10}return}
    if(t.shOn)d*=.2;d*={gunship:.85,carrier:.8,elite:.8}[t.type]||1;t.hp-=d;t.flash=.08;SW.FX.text(t.x,t.y-t.r,Math.round(d),col);this.sfx('hit');SW.FX.burst(t.x,t.y,'#fff',3,120,.25);if(t.hp<=0)this.kill(t,true)},
  kill(e,reward){e.dead=true;const T=SW.Enemies.T[e.type];SW.FX.burst(e.x,e.y,T.col,28,240,.7,3);SW.FX.ring(e.x,e.y,T.col,e.r*2);this.sfx('explode');this.shake(e.r>20?5:2);
    if(!reward)return;this.kills++;this.combo++;this.comboT=3;this.maxCombo=Math.max(this.maxCombo,this.combo);this.addScore(T.sc);this.p.special=Math.min(100,this.p.special+4);SW.data.totals.kills++;SW.Missions.event('kills',1);SW.Missions.event('combo',this.combo);
    if(Math.random()<(e.r>20?.4:.14))this.drop(e.x,e.y)},
  addScore(v){this.score+=Math.round(v*(1+Math.min(this.combo,50)*.1)*(this.p.buf.mult>0?2:1));SW.Missions.event('score',this.score)},
  drop(x,y,type){if(!type){let tot=0;for(const k in this.PU)tot+=this.PU[k].w;let r=Math.random()*tot;for(const k in this.PU){r-=this.PU[k].w;if(r<=0){type=k;break}}}this.pickups.push({x,y,vy:70,type,t:0})},
  beamHit(p){const m=p.dmgMul()*3.2;for(const t of this.targets().concat(this.rocks))if(!t.dead&&t.y<p.y&&Math.abs(t.x-p.x)<(t.d?t.w*.4:t.r)+8){this.dmg(t,m,false);this.hits++;if(Math.random()<.4)SW.FX.burst(t.x,t.y+t.r,'#f6a',2,120,.3)}},
  // ---- special abilities (Q). Energy cost is reduced by the Special Cooldown upgrade. ----
  useSpecial(){const p=this.p,id=SW.data.special,a=this.ABIL[id],cost=a.cost*p.st.cool;if(p.special<cost){this.toast('Special energy low');this.sfx('ui');return}
    p.special-=cost;SW.data.totals.specials++;SW.Missions.event('special',1);const FX=SW.FX;
    if(id=='emp'){this.enemies.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<300)e.stun=3.5});this.eb.forEach(b=>{if(b.on&&Math.hypot(b.x-p.x,b.y-p.y)<300)b.on=false});FX.ring(p.x,p.y,'#8cf',300);this.sfx('emp')}
    else if(id=='shield'){p.boost=80;p.buf.sh=8;this.sfx('shield');FX.ring(p.x,p.y,'#ffd740',60)}
    else if(id=='warp'){this.tsT=5;this.sfx('shield');FX.ring(p.x,p.y,'#b388ff',400)}
    else if(id=='over'){p.buf.over=8;this.sfx('pickup')}
    else if(id=='nova'){this.enemies.forEach(e=>this.dmg(e,140,false));if(this.boss&&this.boss.state=='fight')this.dmg(this.boss,160,false);this.rocks.forEach(r=>this.dmg(r,999,false));this.clearBullets();FX.ring(p.x,p.y,'#fff',700);FX.burst(p.x,p.y,'#fff',70,500,.9,3);this.flash();this.shake(14);this.sfx('emp')}
    else if(id=='repair'){p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.4);this.sfx('pickup');FX.burst(p.x,p.y,'#6f6',20,120,.8)}},
  collect(k){const p=this.p,b=p.buf;this.pickN++;SW.data.totals.pickups++;SW.Missions.event('pickup',1);this.sfx('pickup');
    switch(k){case'hp':p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.35);break;case'shield':p.sh=Math.min(p.maxsh,p.sh+p.maxsh*.5);break;case'invuln':b.invuln=6;break;case'dmg':b.dmg=10;break;case'rate':b.rate=10;break;case'rapid':b.rapid=8;break;
      case'life':p.lives=Math.min(5,p.lives+1);break;case'mult':b.mult=12;break;case'energy':p.special=Math.min(100,p.special+50);break;case'credit':this.runCredits+=25;break;case'ammo':p.missiles+=6;p.rockets+=6;break;
      case'weapon':{const pool=SW.Weapons.order.filter(w=>!p.owned.includes(w));if(pool.length&&Math.random()<.6){const w=pool[(Math.random()*pool.length)|0];p.owned.push(w);p.weapon=w;this.toast('New weapon: '+SW.Weapons.defs[w].name)}else{p.wl=Math.min(5,p.wl+1);this.toast('Weapon level '+p.wl)}}}},
  // ---- waves ----
  spawnWave(){const w=SW.Levels.wave(this.idx,this.wi,this.endless);this.hpMul=this.dif.hp*(1+(this.endless?.06*this.wi:.07*this.idx));w.forEach(s=>this.q.push({t:this.time+s.delay,type:s.type,x:s.x}))},
  updateWaves(dt){this.wt-=dt;const L=this.data,total=this.endless?1e9:L.waves,idle=!this.q.length&&!this.enemies.length;
    if(this.ph=='intro'){if(this.wt<=0)this.ph='gap',this.wt=.6}
    else if(this.ph=='gap'){if(this.wt<=0){if(this.wi<total){this.spawnWave();this.ph='fight';this.wt=50}else if(L.boss&&!this.boss&&!this.bossDone){this.ph='bossIntro';this.wt=2;SW.BG.warp=.8}else if(idle&&(!L.boss||this.bossDone))this.finish()}}
    else if(this.ph=='fight'){if(idle||this.wt<=0&&!this.q.length){this.wi++;SW.Missions.event('waves',this.wi);this.ph='gap';this.wt=1.4}}
    else if(this.ph=='bossIntro'){if(this.wt<=0){this.boss=SW.Bosses.spawn(L.boss,this);this.ph='boss'}}
    else if(this.ph=='boss'&&this.bossDone&&idle)this.finish();
    while(this.q.length&&this.q[0].t<=this.time){const s=this.q.shift();this.spawnEnemy(s.type,s.x,-30)}},
  bossDead(b){this.boss=null;this.bossDone=true;this.bossKills++;SW.data.totals.bosses++;SW.Missions.event('boss',1);this.addScore(2500+this.idx*300);this.runCredits+=150+this.idx*20;SW.FX.burst(b.x,b.y,'#fff',120,520,1.4,3);SW.FX.ring(b.x,b.y,'#ffd',500);this.flash();this.shake(16);this.enemies.forEach(e=>this.kill(e,true));this.q.length=0;
    for(let i=0;i<5;i++)this.drop(b.x+(Math.random()-.5)*120,b.y+(Math.random()-.5)*60);this.clearBullets()},
  // finish(): level complete. Rating uses accuracy, deaths, speed and score. Rewards are credits; the next level unlocks ONLY here (real objectives done).
  finish(){if(this.state!='playing')return;this.state='complete';const acc=this.shots?Math.min(1,this.hits/this.shots):0,par=this.data.waves*26+(this.data.boss?70:0);let pts=0;if(acc>=.35)pts++;if(this.livesLost==0)pts++;if(this.time<par)pts++;if(this.score>=1500+this.idx*900)pts++;
    const rate=['C','C','B','A','S'][pts],cr=110+this.idx*35+pts*45+this.runCredits;SW.data.credits+=cr;const d=SW.data;d.completed[this.idx]=Math.max(d.completed[this.idx]|0,pts+1);d.best[this.idx]=Math.max(d.best[this.idx]|0,this.score);d.unlocked=Math.max(d.unlocked,Math.min(12,this.idx+2));d.totals.levels++;
    SW.Missions.event('levels',1);if(this.livesLost==0)SW.Missions.event('flawless',1);if(this.time<150)SW.Missions.event('fast',1);SW.Missions.event('credits',d.credits);SW.Missions.event('ships',d.ships.length);
    const last=this.idx==11;if(last)SW.Missions.event('campaign',1);SW.Storage.addScore({score:this.score,level:this.idx+1,mode:'campaign',date:new Date().toLocaleDateString()});SW.Storage.save();this.sfx(last?'victory':'complete');SW.Audio.pause(true);

  // ---- HUD (HTML). set() only touches the DOM when a value changed. ----

</script><script>/* inlined sw-ui.js */
// ui.js — every menu screen (main, level select, hangar, upgrades, missions, settings, controls, scores, credits, pause, game over, level complete, victory) and the confirm dialog.
// Screens are built as HTML strings and put into #screen. Buttons carry data-a="action"; ONE click listener (event delegation) runs the action, so there are no dead buttons.
SW.UI={
  cur:null,from:'main',under:null,
  init(){const s=this.el=document.getElementById('screen');
    s.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;SW.Audio.resume();SW.Audio.sfx('ui');this.act(b.dataset.a,b.dataset.v)});
    s.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const t=e.target,v=t.type=='checkbox'?t.checked:t.type=='range'?parseFloat(t.value):t.value;SW.Settings.set(k,v);if(t.type=='range'&&t.nextElementSibling)t.nextElementSibling.textContent=Math.round(v*100)/100});
    document.getElementById('pauseBtn').addEventListener('click',()=>SW.Game.pause())},
  hide(){this.el.classList.add('hidden');this.cur=null;this.touchVis()},
  show(name,arg){const G=SW.Game;if((name=='settings'||name=='controls')&&(this.cur=='main'||this.cur=='pause'))this.from=this.cur;this.cur=name;this.el.innerHTML=this[name](arg);this.el.classList.remove('hidden');this.touchVis();
    const f=this.el.querySelector('.btn.primary')||this.el.querySelector('.btn');if(f)f.focus({preventScroll:true})},
  // Touch controls appear on touch devices (or when forced on) only while a level is running/paused.
  touchVis(){const t=SW.Settings.get('touch'),on=t=='on'||t=='auto'&&window.matchMedia&&matchMedia('(pointer:coarse)').matches,g=SW.Game.state;document.getElementById('touch').classList.toggle('hidden',!(on&&(g=='playing'||g=='paused')&&t!='off'))},
  back(){const c=this.cur;if(!c||c=='main'||c=='over'||c=='complete'||c=='victory')return;if(c=='pause')return SW.Game.resume();if(c=='confirm')return this.show(this.under);
    if(c=='settings'||c=='controls')return this.show(this.from);this.show('main')},
  enter(){const f=document.activeElement;if(f&&f.dataset&&f.dataset.a&&this.el.contains(f))return f.click();const b=this.el.querySelector('.btn.primary');if(b)b.click()},
  confirm(msg,yes,v){this.under=this.cur;this.pending=[yes,v];this.cur='confirm';this.el.innerHTML=`<h2>${msg}</h2><div class="menu"><button class="btn" data-a="no">NO, GO BACK</button><button class="btn primary" data-a="yes">YES</button></div>`;this.el.querySelector('.btn').focus()},
  act(a,v){const G=SW.Game,D=SW.data,C=SW.Controls;switch(a){

    case'levels':case'hangar':case'upgrades':case'missions':case'settings':case'controls':case'scores':case'credits':this.show(a);break;
    case'main':this.show('main');break;case'back':this.back();break;case'resume':G.resume();break;
    case'retry':G.startLevel(G.endless?-1:G.idx);break;case'next':G.startLevel(G.idx+1);break;
    case'restart':this.confirm('Restart this level? Progress in it will be lost.',()=>G.startLevel(G.endless?-1:G.idx));break;
    case'menu':this.confirm(G.state=='paused'?'Abandon this level and return to the main menu?':'Return to the main menu?',()=>G.toMenu());break;
    case'yes':{const[f]=this.pending;f();break}case'no':this.show(this.under);break;
    case'ship':if(D.ships.includes(v)){D.ship=v;SW.Storage.save()}else{const c=SW.Player.SHIPS[v].cost;if(D.credits>=c){D.credits-=c;D.ships.push(v);D.ship=v;SW.Missions.event('ships',D.ships.length);SW.Storage.save();G.toast('Ship unlocked!')}else G.toast('Not enough credits')}this.show('hangar');break;
    case'abil':D.special=v;SW.Storage.save();this.show('hangar');break;
    case'buy':{const u=SW.Player.UPG.find(x=>x.id==v),l=SW.Player.lv(v),c=SW.Player.cost(v);if(l>=5)break;if(D.credits<c){G.toast('Not enough credits');break}D.credits-=c;D.upgrades[v]=l+1;SW.Storage.save();this.show('upgrades');break}
    case'bind':G.toast('Press a key for: '+C.ACTIONS.find(x=>x[0]==v)[1]);C.capture=code=>{if(code=='Escape'&&v!='pause'){this.show('controls');return}const d=C.rebind(v,code);if(d)G.toast('Already used by: '+d);this.show('controls')};break;

  menuBtns(l){return'<div class="menu">'+l.map(([a,t,p,v])=>`<button class="btn${p?' primary':''}" data-a="${a}"${v!==undefined?` data-v="${v}"`:''}>${t}</button>`).join('')+'</div>'},

  main(){return`<h1>SPACEWAR INFINITY</h1><p class="sub">DEFEND THE GALAXY. SURVIVE THE INFINITE.</p>`+this.menuBtns([['start','START GAME',1],['cont','CONTINUE · LEVEL '+Math.min(12,SW.data.unlocked)],['levels','LEVEL SELECT'],['hangar','HANGAR'],['upgrades','UPGRADES'],['missions','MISSIONS'],['settings','SETTINGS'],['controls','CONTROLS'],['scores','HIGH SCORES'],['credits','CREDITS']])+`<small>Credits: ${SW.data.credits} ¢ · Ship: ${SW.Player.SHIPS[SW.data.ship].name}</small>`},
  levels(){const D=SW.data;let h='<h2>LEVEL SELECT</h2><div class="panel">';SW.WORLDS.forEach((w,wi)=>{h+=`<h3>WORLD ${wi+1} — ${w}</h3><div class="grid">`;SW.LEVELS.forEach((L,i)=>{if(L.w!=wi)return;const un=i<D.unlocked,done=D.completed[i];h+=`<button class="card${un?'':' lock'}${done?' sel':''}" ${un?`data-a="play" data-v="${i}"`:'disabled'} style="color:inherit;font:inherit;cursor:${un?'pointer':'not-allowed'}"><b>${i+1}. ${L.n}</b><br>${L.boss?'BOSS · ':''}${un?(done?'✔ Rating '+['','C','B','A','S'][Math.min(4,done)]:'Unlocked'):'🔒 Locked'}<br>Best: ${D.best[i]|0}</button>`});h+='</div>'});
    const eu=!!D.completed[2];h+=`<h3>SURVIVAL</h3><div class="grid"><button class="card${eu?'':' lock'}" ${eu?'data-a="endless"':'disabled'} style="color:inherit;font:inherit"><b>∞ ENDLESS</b><br>${eu?'Best: '+D.endlessBest:'🔒 Complete level 3'}</button></div></div>`+this.backBtn();return h},
  hangar(){const D=SW.data,S=SW.Player.SHIPS,bar=(v,m)=>`<div class="prog"><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;let h=`<h2>HANGAR</h2><p>Credits: <b>${D.credits}</b></p><div class="panel"><div class="grid">`;
    for(const id in S){const s=S[id],own=D.ships.includes(id);h+=`<div class="card${D.ship==id?' sel':''}"><b style="color:${s.col}">${s.name}</b><br><small>${s.desc}</small>HP ${s.hp}${bar(s.hp,150)}Shield ${s.sh}${bar(s.sh,100)}Speed ${s.speed}${bar(s.speed,380)}Power ${s.dmg}x${bar(s.dmg,1.5)}<button class="btn sm" data-a="ship" data-v="${id}" style="margin-top:6px">${D.ship==id?'SELECTED':own?'SELECT':'BUY '+s.cost+'¢'}</button></div>`}
    h+='</div><h3>SPECIAL ABILITY (Q)</h3><div class="row2">';for(const id in SW.Game.ABIL)h+=`<button class="btn sm${D.special==id?' primary':''}" data-a="abil" data-v="${id}">${SW.Game.ABIL[id].name} (${SW.Game.ABIL[id].cost})</button>`;return h+'</div></div>'+this.backBtn()},
  upgrades(){const D=SW.data;let h=`<h2>UPGRADES</h2><p>Credits: <b>${D.credits}</b></p><div class="panel">`;for(const u of SW.Player.UPG){const l=SW.Player.lv(u.id),c=SW.Player.cost(u.id);h+=`<div class="set"><span><b>${u.name}</b> ${'●'.repeat(l)}${'○'.repeat(5-l)}<br><small>${u.per} per level</small></span><button class="btn sm" data-a="buy" data-v="${u.id}" ${l>=5||D.credits<c?'disabled':''}>${l>=5?'MAX':c+'¢'}</button></div>`}
    const st=SW.Player.stats();return h+`<p><small>Now: HP ${st.hp} · Shield ${st.sh} · Speed ${Math.round(st.speed)} · Damage x${st.dmg.toFixed(2)} · Rate x${st.fire.toFixed(2)} · Crit ${Math.round(st.crit*100)}%</small></p></div>`+this.backBtn()},
  missions(){const M=SW.Missions,row=m=>{const p=M.prog(m),d=M.done(m);return`<div class="set"><span>${d?'✔ ':''}${m.name}<div class="prog"><i style="width:${p/m.target*100}%"></i></div></span><span>${Math.min(p,m.target)}/${m.target} · +${m.reward}¢</span></div>`};
    return`<h2>MISSIONS</h2><div class="panel">${SW.MISSIONS.map(row).join('')}<h3>ACHIEVEMENTS</h3>${SW.ACH.map(row).join('')}</div>`+this.backBtn()},
  settings(){let h='<h2>SETTINGS</h2><div class="panel">',g='';for(const[grp,k,l,t,o]of SW.SCHEMA){if(grp!=g){g=grp;h+=`<h3>${grp.toUpperCase()}</h3>`}const v=SW.Settings.get(k);
      h+=`<div class="set"><label for="s_${k}">${l}</label>`+(t=='toggle'?`<input id="s_${k}" type="checkbox" data-k="${k}" ${v?'checked':''}>`:t=='range'?`<input id="s_${k}" type="range" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${v}" data-k="${k}"><span>${Math.round(v*100)/100}</span>`:`<select id="s_${k}" data-k="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`)+'</div>'}
    return h+'</div><div class="row2"><button class="btn primary" data-a="applyset">APPLY</button><button class="btn" data-a="resetset">RESET DEFAULTS</button><button class="btn" data-a="wipe">ERASE SAVE</button>'+this.backBtn()+'</div>'},
  controls(){const C=SW.Controls,names=c=>c.replace('Key','').replace('Arrow','↑↓←→ '.slice(0,0)+'Arrow ').replace('ShiftLeft','Left Shift');
    return`<h2>CONTROLS</h2><div class="panel"><table>`+C.ACTIONS.map(a=>`<tr><td>${a[1]}</td><td><button class="btn sm" data-a="bind" data-v="${a[0]}">${C.map[a[0]].map(names).join(' / ')}</button></td></tr>`).join('')+`</table>
    <p><small>Click a key to rebind it (a key already in use is rejected). Arrow keys also work for movement. <b>Mouse:</b> left = fire, right = missiles, wheel = cycle weapon; enable "Mouse aiming" in Settings to steer by pointer. <b>Touch:</b> left-side joystick + FIRE / SPECIAL / DASH / MISSILE buttons. <b>Gamepad:</b> stick = move, A = fire, B = missile, X = special, RB = dash, Start = pause. Map (M) is not used in this game.</small></p></div>
    <div class="row2"><button class="btn" data-a="resetkeys">RESTORE DEFAULTS</button>${this.backBtn()}</div>`},
  scores(){const s=SW.data.scores;return`<h2>HIGH SCORES</h2><div class="panel"><small>Saved only on this device — not an online leaderboard.</small><table><tr><th>#</th><th>Score</th><th>Mode</th><th>Level</th><th>Date</th></tr>`+(s.length?s.map((x,i)=>`<tr><td>${i+1}</td><td>${x.score}</td><td>${x.mode}</td><td>${x.level||'∞'}</td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="5">No scores yet — go fly!</td></tr>')+`</table><p>Endless best: ${SW.data.endlessBest}</p></div>`+this.backBtn()},
  credits(){return`<h2>CREDITS</h2><div class="panel" style="text-align:center">Spacewar Infinity<br><small>Design, code, graphics and sound: original, generated with HTML5 Canvas, CSS3, vanilla JavaScript and the Web Audio API.<br>No frameworks, no engines, no external assets.</small></div>`+this.backBtn()},
  pause(){return'<h2>PAUSED</h2>'+this.menuBtns([['resume','RESUME',1],['restart','RESTART LEVEL'],['controls','CONTROLS'],['settings','SETTINGS'],['menu','MAIN MENU']])},
  over(){const r=SW.Game.res;return`<h2 style="color:#ff5252">GAME OVER</h2><div class="panel" style="text-align:center">Score <b>${r.score}</b><br>Enemies destroyed ${r.kills} · Time ${Math.round(r.time)}s<br>Accuracy ${Math.round(r.acc*100)}% · Bosses ${r.bosses}<br>Rewards: +${r.cr} credits</div>`+this.menuBtns([['retry','RETRY',1],['menu','MAIN MENU']])},
  complete(){const r=SW.Game.res,last=r.idx>=11;return`<h2>LEVEL COMPLETE</h2><div class="panel" style="text-align:center"><div style="font-size:3rem;color:var(--mg)">${r.rate}</div>Score ${r.score} · Kills ${r.kills} · Time ${Math.round(r.time)}s<br>Accuracy ${Math.round(r.acc*100)}% · +${r.cr} credits</div>`+this.menuBtns([[last?'main':'next',last?'MAIN MENU':'NEXT LEVEL',1],['retry','REPLAY'],['menu','MAIN MENU']])},
  victory(){const r=SW.Game.res;return`<h1>VICTORY!</h1><p class="sub">THE INFINITY OVERLORD IS DEFEATED</p><div class="panel" style="text-align:center">Campaign complete! Final score ${r.score} · Rating ${r.rate} · +${r.cr} credits<br><small>Endless survival mode is now open in Level Select.</small></div>`+this.menuBtns([['endless','ENDLESS SURVIVAL',1],['main','MAIN MENU']])}
};

</script><script>/* inlined sw-main.js */
// main.js — boot file. Runs once the page is ready: connects the modules, sizes the canvas, wires window events, and shows the main menu.
(function(){
  const cv=document.getElementById('game'),hud=document.getElementById('hud');
  // Keep the 600x800 canvas fully visible with the right proportions at any window size (and put the HUD exactly over it).
  function resize(){const s=Math.min(innerWidth/600,innerHeight/800),w=Math.floor(600*s),h=Math.floor(800*s);cv.style.width=w+'px';cv.style.height=h+'px';
    const l=Math.round((innerWidth-w)/2),t=Math.round((innerHeight-h)/2);hud.style.inset='auto';hud.style.left=l+'px';hud.style.top=t+'px';hud.style.width=w+'px';hud.style.height=h+'px'}
  addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();
  SW.Controls.init(cv);SW.UI.init();SW.Game.init(cv);
  // Pause automatically when the tab is hidden or the window loses focus (can be turned off in Settings).
  document.addEventListener('visibilitychange',()=>{if(document.hidden)SW.Game.autoPause()});addEventListener('blur',()=>SW.Game.autoPause());
  document.addEventListener('fullscreenchange',()=>{SW.Settings.v.fullscreen=!!document.fullscreenElement;SW.Storage.setJSON('settings',SW.Settings.v)});
  // Browsers block audio until a user gesture: the first click/key resumes it.
  ['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>SW.Audio.resume(),{once:true}));
  SW.UI.show('main');
})();

</script>
<script>/* HOME button: inside the all-in-one hub it asks the parent page to close this game */document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-home-link]");if(a){e.preventDefault();try{parent.postMessage({gh:"home"},"*")}catch(x){}}})</script></body></html>
