<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Rail Rush</title>
<style>/* WHY: same structure as the other games (#w wrapper + #ui overlay + touch pad) so shell.js, sizes and shortcuts behave identically. */
body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center;-webkit-user-select:none;user-select:none}#w{position:relative;margin:auto}canvas{width:100%;display:block;touch-action:none}

<div id="t"><span><button id="sl">◀</button><button id="sr">▶</button></span><span><button id="sp">⏸</button><button id="sd">▼</button><button id="su">▲</button></span></div></div>
<script>/* inlined compat.js */
/* compat.js — makes every page friendlier on ALL devices (desktop, laptop, tablet, phone AND button/keypad phones).
   WHY: older browsers (e.g. KaiOS/Firefox 48, old iOS) lack newer features, and keypad phones have no mouse, touch or full keyboard.
   HOW: (1) GH.LITE flag for weak devices  (2) a visible error banner instead of a silent blank page  (3) KEYPAD MAP: 2/4/6/8 = arrows, 5 = Enter/Jump, 0 = Space,
        soft-left / Back / * = Esc (pause), soft-right = Enter, # = R(restart)  (4) arrow-key focus navigation in menus  (5) GH.hold(): press-and-hold buttons that work with Pointer Events OR touch+mouse.
   Plain ES6 only (no async/await, no ?. , no object spread) so it runs on old engines.   IMPROVE: add more key layouts, a gamepad->keys bridge. */
(function(){
  var UA=navigator.userAgent||'',GH=window.GH=window.GH||{};
  GH.LITE=/KaiOS|Opera Mini|Nokia|Series ?40|Symbian|UCBrowser|NetFront|MIDP|Maemo/i.test(UA)||(Math.min(screen.width||999,screen.height||999)<=360&&!('ontouchstart' in window));
  // ---- (2) error banner: tell the user what is wrong instead of showing nothing
  window.addEventListener('error',function(e){var b=document.getElementById('gh-err');if(!b){b=document.createElement('div');b.id='gh-err';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#500;color:#fff;font:12px monospace;padding:6px;text-align:center';(document.body||document.documentElement).appendChild(b)}
    b.textContent='Warning: '+(e.message||'script error')+' - please use an up-to-date browser (Chrome, Firefox, Safari or Edge).'});
  // ---- (3) keypad / old-browser key translation
  var CODE={37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',13:'Enter',27:'Escape',32:'Space',16:'ShiftLeft',8:'Backspace'};
  function codeOf(e){if(e.code)return e.code;if(CODE[e.keyCode])return CODE[e.keyCode];if(e.keyCode>=65&&e.keyCode<=90)return 'Key'+String.fromCharCode(e.keyCode);if(e.keyCode>=48&&e.keyCode<=57)return 'Digit'+(e.keyCode-48);if(e.keyCode>=96&&e.keyCode<=105)return 'Numpad'+(e.keyCode-96);return''}
  function overlayOpen(){var ids=['ov','ui','screen','frame'];for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el&&el.offsetWidth>0&&getComputedStyle(el).display!=='none'&&!el.classList.contains('hidden')&&!el.classList.contains('hide'))return el}return null}
  GH.overlayOpen=overlayOpen;
  var KEYPAD={'2':'ArrowUp','8':'ArrowDown','4':'ArrowLeft','6':'ArrowRight','0':'Space','#':'KeyR','*':'Escape','SoftLeft':'Escape','SoftRight':'Enter','Backspace':'Escape','EndCall':'Escape'};
  var KP=GH.LITE||(window.matchMedia&&matchMedia('(pointer:none)').matches)||/[?&]keypad=1/.test(location.search);try{if(localStorage.getItem('gh_keypad')==='1')KP=true}catch(x){}
  GH.keypad=KP;try{var hc=document.documentElement;hc.className+=(KP?' kp':'')+(GH.LITE?' lite':'')}catch(x){}   // keypad mode: auto on for keypad phones, or switch it on in the hub profile panel (gh_keypad)
  function target(e){var k=e.key,c=codeOf(e),tag=(e.target&&e.target.tagName)||'',typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tag),isNum=/^Numpad[0-9]$/.test(c);
    if(typing&&k!=='SoftLeft'&&k!=='SoftRight')return null;      // never steal typing in text boxes
    if(isNum)k=c.charAt(6);                                       // numpad digits always work (2/4/6/8/5)
    var digit=/^[0-9]$/.test(k);if(digit&&!(KP||isNum))return null;
    if((k==='*'||k==='#'||k==='Backspace'||k==='EndCall')&&!KP)return null;
    if(k==='5')return overlayOpen()?'Enter':'Space';
    return KEYPAD[k]||null}
  function synth(type,code,orig){var ev;try{ev=new KeyboardEvent(type,{key:code.indexOf('Key')===0?code.slice(3).toLowerCase():code,code:code,bubbles:true,cancelable:true})}catch(x){return}
    try{Object.defineProperty(ev,'__gh',{value:1})}catch(x){}window.dispatchEvent(ev)}
  function onKey(e){if(e.__gh)return;var t=target(e);
    if(t){e.stopImmediatePropagation();e.preventDefault();if(e.repeat&&e.type==='keydown')return;synth(e.type,t,e);return}
    if(!e.code){var c=codeOf(e);if(c){e.stopImmediatePropagation();synth(e.type,c,e)}}}
  window.addEventListener('keydown',onKey,true);window.addEventListener('keyup',onKey,true);
  // ---- (4) menu focus navigation with arrows (keypad D-pad). Games keep their own arrow handling; this only moves the focus ring in open menus.
  function visible(el){return el.offsetWidth>0&&el.offsetHeight>0&&!el.disabled}
  function list(root){var a=root.querySelectorAll('button,a[href],input,select,[tabindex]'),out=[];for(var i=0;i<a.length;i++)if(visible(a[i]))out.push(a[i]);return out}
  window.addEventListener('keydown',function(e){var c=e.code;if(c!=='ArrowUp'&&c!=='ArrowDown'&&c!=='ArrowLeft'&&c!=='ArrowRight')return;
    var ov=overlayOpen(),root=ov||(document.body.hasAttribute('data-nav')?document.body:null);if(!root)return;
    var ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&(c==='ArrowLeft'||c==='ArrowRight'))return;
    var items=list(root);if(!items.length)return;var i=items.indexOf(ae);var d=(c==='ArrowDown'||c==='ArrowRight')?1:-1;i=i<0?(d>0?0:items.length-1):(i+d+items.length)%items.length;items[i].focus();e.preventDefault&&e.preventDefault()},false);
  // ---- (5) press/hold helpers that work with Pointer Events (modern) or touch+mouse (old iOS/Android)
  GH.hold=function(el,down,up){if(!el)return;var on=function(e){if(e.cancelable)e.preventDefault();down(e)},off=function(e){if(up)up(e)};
    if(window.PointerEvent){el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(function(t){el.addEventListener(t,off)})}
    else{el.addEventListener('touchstart',on);el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off)}};
  GH.xy=function(e){var t=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e;return{x:t.clientX,y:t.clientY}};
  // base64(UTF-8) -> string for embedded pages (works in old browsers too)
  GH.b64=function(b){return decodeURIComponent(escape(atob(b)))};
})();

</script><script>/* inlined storage.js */
// WHY: ONE storage layer shared by hub AND games, so cloud sync later = change one object.
// HOW: `Store.backend` exposes get/set that return Promises (so a cloud backend can be async). Default = browser localStorage (no server).
// Written with plain Promises (no async/await) so it also runs on older browsers.  IMPROVE: write a cloud backend and do `Store.backend=cloud`.
const Store={
  backend:{get(k){var v=null;try{v=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}return Promise.resolve(v)},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return Promise.resolve()}},
  // PIN hashing (SHA-256 when available, small fallback hash otherwise). IMPROVE: salt + server-side hashing; 6-digit PINs are weak.
  hash(p){var fb=function(){var h=0,t='gh:'+p;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'f'+h};
    try{if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode('gh:'+p)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')},function(){return fb()})}catch(e){}
    return Promise.resolve(fb())},
  users(){return this.backend.get('gh_users').then(function(u){return u||{}})},
  user(){return localStorage.getItem('gh_session')},
  signUp(id,pin){var self=this;id=id.trim().toLowerCase();if(!id||!/^\d{6}$/.test(pin))return Promise.resolve('Need a name/email and a 6-digit PIN');
    return self.users().then(function(u){if(u[id])return 'Name already used';return self.hash(pin).then(function(h){u[id]={pin:h,hist:{}};return self.backend.set('gh_users',u).then(function(){localStorage.setItem('gh_session',id);return ''})})})},
  signIn(id,pin){var self=this;id=id.trim().toLowerCase();return self.users().then(function(u){if(!u[id])return 'Wrong name or PIN';return self.hash(pin).then(function(h){if(u[id].pin!==h)return 'Wrong name or PIN';localStorage.setItem('gh_session',id);return ''})})},
  signOut(){localStorage.removeItem('gh_session')},
  // Games call this at game over: keeps best + last 20 plays per game for the profile history.
  saveScore(game,score){var self=this,id=self.user();if(!id)return Promise.resolve();return self.users().then(function(u){if(!u[id])return;var h=u[id].hist[game]||(u[id].hist[game]={best:0,plays:[]});h.best=Math.max(h.best,score);h.plays.unshift({s:score,t:Date.now()});h.plays.length=Math.min(h.plays.length,20);return self.backend.set('gh_users',u)})}
};

// ===== SHARED DIFFICULTY. WHY: ONE setting (chosen in the hub or any game menu) changes speed, trap density, spacing, damage and lives in every game.
// HOW: Store.diff() returns the numbers of the chosen level. spd=speed x, spawn=trap density x, gap=spacing x, dmg=damage x, lives, chase=guard window (frames), ko=1-hit KO, sw=lane-switching trains, missile=homing-missile interval (frames, 0=off).
// IMPROVE: per-game overrides, custom difficulty sliders, unlockable "Insane" tier.
Store.DIFFS={easy:{n:'EASY',spd:.85,spawn:.75,gap:1.25,dmg:.7,lives:7,chase:300,ko:false,sw:false,missile:0},
 normal:{n:'NORMAL',spd:1,spawn:1,gap:1,dmg:1,lives:5,chase:480,ko:false,sw:false,missile:0},
 hard:{n:'HARD',spd:1.15,spawn:1.3,gap:.85,dmg:1.3,lives:4,chase:720,ko:false,sw:true,missile:480},
 nightmare:{n:'NIGHTMARE',spd:1.3,spawn:1.6,gap:.7,dmg:2,lives:3,chase:0,ko:true,sw:true,missile:300}};
Store.diffKey=()=>{const k=localStorage.getItem('gh_diff');return Store.DIFFS[k]?k:'normal'};
Store.diff=()=>Store.DIFFS[Store.diffKey()];
Store.setDiff=k=>{if(Store.DIFFS[k])localStorage.setItem('gh_diff',k)};

</script><script data-home="#">/* inlined shell.js */
// shell.js — WHY: one shared "game window" helper used by EVERY game page: digital HOME button, size selector (S/M/L/FIT) and fullscreen.
// HOW: injects its own CSS + a top bar, then sizes the element #w (the game wrapper) from the canvas aspect ratio. Size choice is remembered in localStorage 'gh_size'.
// IMPROVE: add more sizes, a per-game size, or a settings drawer. New games only need a #w wrapper containing a <canvas> and this script tag with data-home.
(function(){const home=document.currentScript.dataset.home||'index.html',w=document.getElementById('w'),cv=w.querySelector('canvas');
 const css=document.createElement('style');css.textContent=`#shell{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:'Courier New',monospace}
 #shell .home{color:#39ff88;border:2px solid #39ff88;background:#04140a;padding:6px 14px;border-radius:6px;text-decoration:none;font-weight:bold;letter-spacing:2px;text-shadow:0 0 8px #39ff88;box-shadow:0 0 10px #39ff8855,inset 0 0 10px #39ff8833;transition:.15s}
 #shell .home:hover{background:#39ff88;color:#000;text-shadow:none}
 #shell button{margin:0 3px;padding:6px 10px;background:#04140a;color:#39ff88;border:1px solid #39ff8888;border-radius:6px;font:inherit;cursor:pointer}#shell button.on{background:#39ff88;color:#000}
 html.kp #shell button,html.lite #shell button{display:none}
 @media(max-width:480px){#shell{padding:4px 6px}#shell .home{padding:4px 8px;font-size:.8rem}#shell button{padding:4px 7px;margin:0 2px;font-size:.8rem}}`;document.head.appendChild(css);
 const bar=document.createElement('div');bar.id='shell';bar.innerHTML=`<a class="home" href="${home}"${home=='#'?' data-home-link':''}>⏻ HOME</a><span>${['S','M','L','FIT'].map(s=>`<button data-s="${s}">${s}</button>`).join('')}<button data-s="FS" title="Fullscreen">⛶</button></span>`;document.body.prepend(bar);
 const sizes={S:480,M:760,L:1100};
 // apply(): FIT = biggest size that fits BOTH width and height of the screen (keeps aspect). Fullscreen uses the whole screen.
 function apply(){const s=localStorage.getItem('gh_size')||'FIT',a=cv.width/cv.height;let wd;
  if(document.fullscreenElement)wd=Math.min(innerWidth,innerHeight*a);else wd=s=='FIT'?Math.min(innerWidth,(innerHeight-60)*a):Math.min(sizes[s],innerWidth);
  w.style.width=wd+'px';w.style.maxWidth='none';bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s==s))}
 bar.onclick=e=>{const s=e.target.dataset&&e.target.dataset.s;if(!s)return;if(s=='FS'){document.fullscreenElement?document.exitFullscreen():w.requestFullscreen&&w.requestFullscreen();return}localStorage.setItem('gh_size',s);apply()};
 addEventListener('resize',apply);document.addEventListener('fullscreenchange',apply);apply()})();

</script><script>/* inlined surfer.js */
// ===== RAIL RUSH: 3-lane pseudo-3D runner (Subway-Surfers style) in plain Canvas. 
// WHY pseudo-3D: no 3D engine needed. HOW: every object has a depth z (0 = player, bigger = farther). pz(z) shrinks things with distance; sy/sx convert (lane,z) to screen pixels, so lanes converge to the horizon.
// IMPROVE: real art/sprites, curved tracks, more characters, missions, daily rewards, music.
const W=800,H=450,HY=150,BY=390,LW=150,CX=400;                       // horizon y, player base y, lane width, centre x
const pz=z=>1/(1+z*.07),sy=z=>HY+(BY-HY)*pz(z),sx=(l,z)=>CX+l*LW*pz(z); // projection helpers
const S=Object.assign({coins:0,best:0,snd:true,night:false},JSON.parse(localStorage.getItem('sr')||'{}'));const save=()=>localStorage.setItem('sr',JSON.stringify(S));
// Difficulty comes from the shared Store (hub setting). cycleDiff() steps EASY>NORMAL>HARD>NIGHTMARE.
let DF=Store.diff();function cycleDiff(){const ks=Object.keys(Store.DIFFS);Store.setDiff(ks[(ks.indexOf(Store.diffKey())+1)%ks.length]);DF=Store.diff()}
const c=document.getElementById('c'),x=c.getContext('2d'),ui=document.getElementById('ui');
let st='menu',back=null,ent=[],nextZ=60,dist=0,speed=14,got=0,lane=0,plx=0,py=0,vy=0,slide=0,pw={mag:0,shoe:0,jet:0},shield=false,chase=0,shake=0,banner=0,tier=0,f=0,acc=0,lastT=0;
// ===== SOUND: tiny WebAudio beeps (no files). Respects Sound setting.
const AC=new (window.AudioContext||window.webkitAudioContext)();const beep=(fr,d=.07)=>{if(!S.snd)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fr;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
// ===== WINDOWS (same pattern as other games): panel(html, backFn). Esc = backFn, Enter/Space = click green .pri button.
function panel(h,b){back=b||null;ui.innerHTML=h;ui.style.display='flex'}
function menu(msg=''){st='menu';panel(`<h1>🚆 RAIL RUSH</h1><b>Best ${S.best} · Total coins ${S.coins}</b>${msg}<button class="pri" onclick="start()">▶ Run! (Enter)</button><button onclick="cycleDiff();menu()">Difficulty: ${DF.n}</button><button onclick="settings(menu)">⚙ Settings</button><small>←/→ lane · ↑/Space jump · ↓ slide · Esc pause · swipe on phones<br>Hit 2 obstacles in a row and the guard catches you!</small>`)}
function settings(r){panel(`<h2>⚙ Settings</h2><button onclick="S.snd=!S.snd;save();settings(${r.name})">Sound: ${S.snd?'ON':'OFF'}</button><button onclick="S.night=!S.night;save();settings(${r.name})">Sky: ${S.night?'Night':'Sunset'}</button><button onclick="cycleDiff();settings(${r.name})">Difficulty: ${DF.n}</button><button class="pri" onclick="${r.name}()">Back (Esc)</button>`,r)}
function pauseMenu(){st='pause';panel(`<h2>⏸ Paused</h2><button class="pri" onclick="resume()">Resume (Esc / Enter)</button><button onclick="settings(pauseMenu)">⚙ Settings</button><button onclick="start()">Restart</button><button onclick="menu()">Main Menu</button>`,resume)}
function resume(){st='play';ui.style.display='none'}
function start(){DF=Store.diff();ent=[];nextZ=40;dist=0;speed=14*DF.spd;got=0;lane=0;plx=0;py=0;vy=0;slide=0;pw={mag:0,shoe:0,jet:0};shield=false;chase=0;tier=0;banner=0;st='play';ui.style.display='none'}
// ===== SPAWNER. WHY fair: each row blocks at most 1 lane (2 after 400m) so one lane is ALWAYS free; rows are >=14 apart and trains <=8 long so rows never overlap.
// Obstacles: train (solid, change lane), low barrier (jump), high bar (slide). Free lane gets a coin line or a power-up (12%). IMPROVE: pattern library, ramps on trains, moving trains in more variants.
function row(z){const n=dist>Math.max(100,400/DF.spawn)&&Math.random()<.5?2:1,ls=[-1,0,1].sort(()=>Math.random()-.5),bl=ls.slice(0,n),free=ls.slice(n);
 // Trap kinds: train (change lane), low barricade (jump), high bar (slide), pothole grate (jump), side-sweeper cleaner (jump, slides across lanes). Hard+: some trains SWITCH LANES right before impact.
 bl.forEach(l=>{const t=Math.random(),k=t<.3?'train':t<.52?'low':t<.7?'high':t<.86&&dist>150?'pothole':dist>300&&n==1?'sweep':'low';
  ent.push({k,l,z,len:k=='train'?5+Math.random()*3:k=='pothole'?.9:.8,ph:Math.random()*6,vz:k=='train'&&dist>600/DF.spawn&&Math.random()<.4*DF.spawn?1.5:1,sw:k=='train'&&DF.sw&&dist>500/DF.spawn&&Math.random()<.5})});
 const fl=free[0|Math.random()*free.length],r=Math.random();
 if(r<.12)ent.push({k:['mag','shoe','shield','jet'][0|Math.random()*4],l:fl,z:z+2,len:0,y:.3});else for(let i=0;i<5;i++)ent.push({k:'coin',l:fl,z:z+i*1.6,len:0,y:r<.5?.3:1.3})}
// ===== INPUT: keyboard + swipe + touch buttons share these actions. Jump physics: g=40, v=9.5 (shoes 14) in "height units" (barrier=0.5).
const goL=()=>{if(st=='play'){lane=Math.max(-1,lane-1);beep(300,.03)}},goR=()=>{if(st=='play'){lane=Math.min(1,lane+1);beep(300,.03)}},
 jump=()=>{if(st=='play'&&py<=.01&&pw.jet<=0){vy=pw.shoe>0?14:9.5;slide=0;beep(520)}},down=()=>{if(st=='play'){slide=.7;if(py>0)vy=-18}};
const confirmKey=()=>{const b=ui.style.display!='none'&&ui.querySelector('.pri');if(b){b.click();return true}};
addEventListener('keydown',e=>{const k=e.code;if(k=='Enter'){confirmKey();e.preventDefault()}
 if(k=='ArrowLeft'||k=='KeyA')goL();if(k=='ArrowRight'||k=='KeyD')goR();if(k=='ArrowUp'||k=='KeyW'||k=='Space'){if(!confirmKey())jump();e.preventDefault()}if(k=='ArrowDown'||k=='KeyS'){down();e.preventDefault()}
 if(k=='Escape'||k=='KeyP'){if(ui.style.display!='none'&&back)back();else if(st=='play')pauseMenu()}});
let sp0;c.onpointerdown=e=>{sp0=[e.clientX,e.clientY]};c.onpointerup=e=>{if(!sp0)return;const dx=e.clientX-sp0[0],dy=e.clientY-sp0[1];sp0=0;
 if(Math.max(Math.abs(dx),Math.abs(dy))<20){confirmKey()||jump()}else if(Math.abs(dx)>Math.abs(dy))dx>0?goR():goL();else dy<0?jump():down()};
const $=id=>document.getElementById(id);[['sl',goL],['sr',goR],['su',jump],['sd',down],['sp',()=>st=='play'?pauseMenu():0]].forEach(([id,fn])=>$(id).onpointerdown=e=>{e.preventDefault();fn()});
// ===== STUMBLE / CAUGHT. WHY: "someone catching up": 1st hit = guard appears right behind you (chase timer); 2nd hit while he is close = caught. Shield absorbs one hit. Trains = instant crash.
function stumble(o,train){spark(CX+plx*LW,BY-45,'#ffffff',12);if(shield){shield=false;o.dead=1;beep(200,.2);shake=10;return}shake=14;beep(90,.25);if(train&&Store.diffKey()!='easy'||chase>0||DF.ko)return over();chase=DF.chase;o.dead=1;speed*=.8}
// ===== UPDATE (fixed 60Hz). Speed ramps with distance and gets a banner every 500m. Magnet pulls coins to your lane; jetpack hovers + drops a coin trail; shoes boost jump.
function update(){const dt=1/60;f++;speed=Math.min(30*DF.spd,(14+dist/120)*DF.spd)*(chase>0?.92:1);dist+=speed*dt;nextZ-=speed*dt;while(nextZ<90){row(nextZ);nextZ+=Math.max(12,(15+Math.random()*8-Math.min(5,dist/300))*DF.gap)}

 plx+=(lane-plx)*.25;if(pw.jet>0){py+=(2.2-py)*.1}else{vy-=40*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}if(slide>0)slide-=dt;if(chase>0)chase--;if(shake>0)shake--;
