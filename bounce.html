<style>/* WHY: strict black/white UI (only the ball has colour). HOW: wrapper is relative so overlay/touch buttons sit over the canvas. */

.sw{width:34px;height:34px;border-radius:50%;padding:0;margin:3px}#t{display:none;position:absolute;bottom:6px;width:100%;justify-content:space-between;padding:0 8px;box-sizing:border-box}#t button{width:64px;height:64px;font-size:1.5rem;opacity:.7;touch-action:none}a{color:#fff}
