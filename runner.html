<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Wild Animal Runner</title>
<style>/* WHY: #w is position:relative so the #ui menu and touch buttons overlay the canvas like a game window. */
body{margin:0;background:#111;color:#fff;font-family:system-ui;text-align:center;-webkit-user-select:none;user-select:none}#w{position:relative;margin:auto}canvas{width:100%;display:block;touch-action:none}
#ui{position:absolute;top:0;right:0;bottom:0;left:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
#ui button{font-size:1rem;margin:3px;padding:9px 14px;border:1px solid #fff5;border-radius:10px;cursor:pointer;background:#1c1f2b;color:#fff}#ui button:hover,.pri{background:#4caf50!important}small{opacity:.7}
/* Touch pad: only shown on touch/small screens. WHY pointer events: one code path for finger, mouse and pen. */
#t{display:none;position:absolute;bottom:6px;left:0;width:100%;justify-content:space-between;padding:0 8px;box-sizing:border-box;pointer-events:none}#t button{pointer-events:auto;width:64px;height:64px;font-size:1.3rem;border-radius:50%;border:2px solid #fff6;background:#0008;color:#fff;touch-action:none}
@media(pointer:coarse),(max-width:800px){#t{display:flex;position:relative;bottom:auto;margin:8px 0 14px}#ui,#ov{overflow:auto;justify-content:flex-start}#ui button,#ov button{padding:5px 9px;font-size:.78rem;margin:2px}#ui h1,#ui h2,#ov h1,#ov h2{font-size:1rem;margin:2px}#ui small,#ov p{font-size:.62rem;margin:2px}}   /* phones: touch pad sits BELOW the game, menus are compact */@media(max-width:480px){#ov,#ui{position:fixed;top:46px;left:0;right:0;bottom:0;z-index:60;background:#000e;overflow:auto;justify-content:flex-start}#ov button,#ui button{padding:8px 10px;font-size:.9rem}}html.kp #t,html.lite #t{display:none!important}
</style></head><body>
<div id="w"><canvas id="c" width="800" height="300"></canvas><div id="ui"></div>
<div id="t"><span><button id="rd">▼</button></span><span><button id="rp">⏸</button><button id="re">⚡</button><button id="rj">▲</button></span></div></div>
<script src="compat.js"></script><script src="storage.js"></script><script src="shell.js" data-home="index.html"></script><script src="runner.js"></script></body></html>
